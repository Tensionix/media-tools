# Audion Media Tools - keys inside the player window.
#
# The section needs two positions, and mpv already has them: `l` sets the A
# point, `l` again sets B, and the piece between them plays in a loop. That is
# the cut, checked by ear before anything is written. The panel reads A and B
# straight out of the player - nothing is bound here for it.
#
# Everything else is mpv's own: space plays and pauses, `,` and `.` step one
# frame back and forward, arrows seek, `f` is fullscreen.

# Backwards playback - the thing a browser player never had. `b` starts it, `n`
# returns to going forwards.
b set play-direction backward ; set pause no ; show-text "<< playing backwards" 1200
n set play-direction forward ; set pause no ; show-text ">> playing forwards"   1200

# Clear the loop without cycling through it.
ctrl+l set ab-loop-a no ; set ab-loop-b no ; show-text "A/B cleared" 1000
