# ============================================================================
# Audion TC - конфиг mpv "полный фарш".
# Живёт в сборке (Ware\mpv-config), путь задаёт обёртка Run\mpv.cmd через
# MPV_HOME - поэтому конфиг переживает обновления mpv и ничего не пишет в
# %APPDATA%\mpv. Комментарии - только отдельными строками: mpv не отсекает
# inline-"#" в строковых значениях. Правьте здесь.
# ============================================================================

# --- Вывод и аппаратное декодирование ---------------------------------------
# hwdec=auto задействует то, что умеет видеокарта: AV1 (NVIDIA RTX 30+),
# 4:2:2 10bit (RTX 50+), HEVC/H.265 10bit, VP9. Что GPU не тянет - декодирует
# процессор, файл всё равно играет.
vo=gpu-next
gpu-api=auto
hwdec=auto
hwdec-codecs=all

# --- Качество вывода --------------------------------------------------------
# Встроенный профиль high-quality: лучшие скейлеры, дизеринг, дебандинг.
profile=high-quality

# --- Плавность движения -----------------------------------------------------
# Синхронизация с частотой монитора и межкадровая интерполяция: убирает рывки
# на панорамах (24 к/с против 60/144 Гц). Чуть нагружает видеокарту.
video-sync=display-resample
interpolation=yes
tscale=oversample

# --- Кэш (сеть и перемотки) -------------------------------------------------
# Читать вперёд ~20 сек / до 256 МБ в память: плавная перемотка потоков и
# файлов с медленных носителей. Для локального SSD роли не играет.
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=20

# --- Звук -------------------------------------------------------------------
# Приоритет языков дорожки; авто-подхват внешних аудиофайлов.
alang=rus,ru,jpn,jp,eng,en
audio-file-auto=fuzzy
volume=100
volume-max=150

# --- Субтитры ---------------------------------------------------------------
slang=rus,ru,eng,en
sub-auto=fuzzy
sub-font=Segoe UI
sub-font-size=42
sub-border-size=2.5

# --- Окно и поведение -------------------------------------------------------
keep-open=yes
save-position-on-quit=yes
osc=yes
border=no

# --- Скриншоты (клавиша s) - рядом с исходным файлом ------------------------
# Обёртка Run\mpv.cmd запускает mpv из папки файла, а screenshot-directory не
# задан - поэтому снимок ложится рядом с исходником. Имя: ИмяФайла-shot-1.
# Кавычки обязательны: без них mpv.conf принимает "%" за спецсинтаксис длины.
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=7
screenshot-template="%F-shot-%n"

# ============================================================================
# Audion Media Tools - поправки под поиск точки реза.
# Всё, что выше, - конфиг владельца из Audion TC, слово в слово. mpv берёт
# последнее значение, поэтому здесь переопределяется ровно то, что мешает
# резать, и ничего больше.
# ============================================================================

# Интерполяция рисует кадры, которых в файле нет. Для просмотра это плавность,
# для реза - ложь: точка ставится по картинке, а картинка смешана из двух
# соседних кадров. Здесь на экране должен быть тот самый кадр, который уедет
# в результат.
interpolation=no
video-sync=audio
framedrop=no

# Точная перемотка всегда: попадать в запрошенный кадр, а не в ближайший
# ключевой.
hr-seek=yes
hr-seek-framedrop=no

# Файл открывается там, куда его открыли, а не там, где закрыли в прошлый раз.
save-position-on-quit=no

# Доли секунды в таймкоде и номер кадра рядом с ним.
osd-fractions=yes
osd-msg3=${time-pos} / ${duration}    frame ${estimated-frame-number}