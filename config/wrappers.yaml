# What every wrapper of Scripts\ runs.
#
# A wrapper is a file of one line - `call "%~dp0Common\run-profile.cmd" "%~n0" %*` - and a door to the console
# command: `media_cli.cmd wrapper <its name> [arguments]`. This file says what is behind each door: the operation
# (or the operations, one after another), the values it sets, and what it is for. The work is the engine's, the
# same as a button of the window does.
#
#   op / set:   the operation and its values; `runs:` instead, when a wrapper runs several in turn
#   fixed:      values that stand over the environment; `set` gives way to it (AUDION_CRF=17 over crf: 14)
#   only:       the kinds of file the wrapper takes; the operation may take more (MKV -> MP4 takes MKV alone)
#   takes:      what the arguments of the command line are: `urls` (yt-dlp links), `sections` (a section, then links)
#   about:      what it does, in English and Russian - for the map of the program and its documents
#
# The environment the wrappers have always read - AUDION_SOURCE, AUDION_OUTPUT, AUDION_DRY_RUN, AUDION_CRF and the
# rest - is read by the console command (system_core\cli.py, WRAPPER_ENVIRONMENT) and goes into the fields of the
# operation that has them. tests\test_wrappers.py holds every wrapper to what it ran before 3.0.0
# (tests\former_wrapper_commands.json) and names every difference.

