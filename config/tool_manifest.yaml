tool:
  id: audion_media_tools
  name: "Audion Media Tools"
  category: "Media"
  version: "2.5.1"

paths:
  input: "Source"
  output: "Transcoded"
  logs: "logs"
  report: "report"
  workspace: "workspace"
  config: "config"
  release: "release"

ui:
  title: "Audion Media Tools"
  host: "127.0.0.1"
  port: 8080
  native: false
  reload: false
  open_browser: true

_shared_fields:
  input_video_formats: &input_video_formats
    id: input_formats
    type: "checkboxes"
    label: "Source file filter"
    label_ru: "Фильтр файлов источника"
    hint: "Empty means the operation uses its own supported source file types."
    hint_ru: "Если пусто, команда сама берёт поддерживаемые типы файлов источника."
    default: []
    options:
      - {value: "mp4", label: "MP4", label_ru: "MP4"}
      - {value: "mov", label: "MOV", label_ru: "MOV"}
      - {value: "mkv", label: "MKV", label_ru: "MKV"}
      - {value: "mxf", label: "MXF", label_ru: "MXF"}
      - {value: "avi", label: "AVI", label_ru: "AVI"}
      - {value: "webm", label: "WEBM", label_ru: "WEBM"}
      - {value: "mts", label: "MTS", label_ru: "MTS"}
      - {value: "m2ts", label: "M2TS", label_ru: "M2TS"}

  decode_backend: &decode_backend
    id: decode_backend
    type: "radio"
    choice_style: "buttons"
    layout: "five_columns"
    label: "Decoder"
    label_ru: "Декодировать через"
    default: "auto"
    span: "full"
    options:
      - {value: "auto", label: "CPU/Auto", label_ru: "CPU/Auto"}
      - {value: "cuda", label: "CUDA", label_ru: "CUDA"}
      - {value: "qsv", label: "QuickSync", label_ru: "QuickSync"}
      - {value: "amd", label: "AMD/D3D11VA", label_ru: "AMD/D3D11VA"}
      - {value: "dav1d", label: "dav1d AV1", label_ru: "dav1d AV1"}

  encode_backend: &encode_backend
    id: encode_backend
    type: "radio"
    choice_style: "buttons"
    layout: "four_columns"
    label: "Encoder"
    label_ru: "Кодер"
    tooltip: "Select the encoder backend. Each backend exposes its own native preset/quality controls below."
    tooltip_ru: "Выбор backend кодирования. Ниже показываются только родные параметры выбранного backend."
    default: "cpu"
    span: "full"
    refresh_on_change: true
    options:
      - {value: "cpu", label: "CPU", label_ru: "CPU", tooltip: "Software x264/x265. Uses the CPU preset line: fast, medium, slow, slower, veryslow.", tooltip_ru: "Software x264/x265. Использует CPU-линейку preset: fast, medium, slow, slower, veryslow."}
      - {value: "cuda", label: "NVENC", label_ru: "NVENC", tooltip: "NVIDIA hardware encoder. Uses NVENC P-presets p5/p6/p7, not CPU slow/veryslow.", tooltip_ru: "Аппаратный кодер NVIDIA. Использует NVENC P-presets p5/p6/p7, не CPU slow/veryslow."}
      - {value: "amd", label: "AMF", label_ru: "AMF", tooltip: "AMD hardware encoder. Uses AMF quality preset: speed, balanced, quality.", tooltip_ru: "Аппаратный кодер AMD. Использует AMF quality preset: speed, balanced, quality."}
      - {value: "qsv", label: "QSV", label_ru: "QSV", tooltip: "Intel QuickSync encoder. Uses QSV preset values veryfast through veryslow.", tooltip_ru: "Intel QuickSync. Использует QSV preset veryfast...veryslow."}

  encode_tuning: &encode_tuning
    id: encode_tuning
    type: "checkboxes"
    label: "Encode tuning"
    label_ru: "Тюнинг кодирования"
    tooltip: "x264/x265 tune values. Hardware encoders use their own quality controls and ignore this list, so it stays CPU-only."
    tooltip_ru: "Значения tune для x264/x265. Аппаратные кодеры используют свои регуляторы качества и не читают этот список, поэтому он доступен только для CPU."
    default: []
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    options:
      - {value: "grain", label: "Grain", label_ru: "Grain"}
      - {value: "film", label: "Film", label_ru: "Film"}
      - {value: "animation", label: "Animation", label_ru: "Animation"}
      - {value: "fastdecode", label: "Fast decode", label_ru: "Fast decode"}
      - {value: "zerolatency", label: "Zero latency", label_ru: "Zero latency"}

  audio_mode: &audio_mode
    id: audio_mode
    type: "radio"
    group: "audio"
    choice_style: "buttons"
    layout: "four_columns"
    span: "full"
    refresh_on_change: true
    label: "Audio"
    label_ru: "Аудио"
    default: "source"
    options:
      - {value: "source", label: "COPY", label_ru: "COPY", tone: "copy"}
      - {value: "aac_320", label: "AAC override", label_ru: "AAC override", tone: "lossy"}
      - {value: "mp3", label: "MP3", label_ru: "MP3", tone: "lossy"}
      - {value: "flac", label: "FLAC", label_ru: "FLAC", tone: "lossless"}
      - {value: "pcm_s16", label: "PCM 16-bit", label_ru: "PCM 16-bit", tone: "uncompressed"}
      - {value: "pcm_s24", label: "PCM 24-bit", label_ru: "PCM 24-bit", tone: "uncompressed"}
      - {value: "pcm_f32", label: "PCM float", label_ru: "PCM float", tone: "uncompressed"}
      - {value: "none", label: "No audio", label_ru: "Без аудио", tone: "utility"}

  mxf_safe_audio_mode: &mxf_safe_audio_mode
    id: audio_mode
    type: "radio"
    group: "audio"
    choice_style: "buttons"
    layout: "four_columns"
    span: "full"
    refresh_on_change: true
    label: "Audio"
    label_ru: "Аудио"
    default: "source"
    options:
      - {value: "source", label: "COPY", label_ru: "COPY", tone: "copy", disabled_if: {output_container: "mxf"}}
      - {value: "aac_320", label: "AAC override", label_ru: "AAC override", tone: "lossy", disabled_if: {output_container: "mxf"}}
      - {value: "mp3", label: "MP3", label_ru: "MP3", tone: "lossy", disabled_if: {output_container: "mxf"}}
      # The MOV muxer answers "flac only supported in MP4".
      - {value: "flac", label: "FLAC", label_ru: "FLAC", tone: "lossless", disabled_if: {output_container: ["mxf", "mov"]}}
      - {value: "pcm_s16", label: "PCM 16-bit", label_ru: "PCM 16-bit", tone: "uncompressed"}
      - {value: "pcm_s24", label: "PCM 24-bit", label_ru: "PCM 24-bit", tone: "uncompressed"}
      - {value: "pcm_f32", label: "PCM float", label_ru: "PCM float", tone: "uncompressed", disabled_if: {output_container: "mxf"}}
      - {value: "none", label: "No audio", label_ru: "Без аудио", tone: "utility"}

  mp3_lame_preset_encode: &mp3_lame_preset_encode
    id: mp3_lame_preset
    type: "radio"
    group: "lame"
    choice_style: "buttons"
    layout: "three_columns"
    span: "full"
    refresh_on_change: true
    visible_if: {audio_mode: "mp3"}
    label: "MP3 / LAME"
    label_ru: "MP3 / LAME"
    default: "v0"
    options:
      - {value: "v0", label: "VBR V0", label_ru: "VBR V0", tone: "lossy",
         description: "Best VBR V0 / Extreme, about 245 kbps.", description_ru: "Best VBR V0 / Extreme, примерно 245 kbps."}
      - {value: "insane", label: "Insane 320", label_ru: "Insane 320", tone: "lossy",
         description: "Insane CBR 320 kbps.", description_ru: "Insane CBR 320 kbps."}
      - {value: "bitrate", label: "By bitrate", label_ru: "По битрейту", tone: "lossy",
         description: "Use the Audio bitrate field, up to the 320 kbps LAME ceiling.",
         description_ru: "Взять значение поля «Битрейт аудио», максимум 320 kbps."}

  audio_bitrate: &audio_bitrate
    id: audio_bitrate
    type: "select"
    label: "Audio bitrate"
    label_ru: "Битрейт аудио"
    default: "384k"
    visible_if:
      any:
        - {audio_mode: "aac_320"}
        - {all: [{audio_mode: "mp3"}, {mp3_lame_preset: "bitrate"}]}
    options:
      - {value: "192k", label: "192 kbps", label_ru: "192 kbps"}
      - {value: "256k", label: "256 kbps", label_ru: "256 kbps"}
      - {value: "320k", label: "320 kbps", label_ru: "320 kbps"}
      # MPEG-1 Layer III stops at 320 kbps. The key differs per page: encode
      # pages ask through audio_mode, the Audio page through audio_format.
      - {value: "384k", label: "384 kbps", label_ru: "384 kbps", disabled_if: {any: [{audio_mode: "mp3"}, {audio_format: "mp3"}]}}

  audio_sample_rate: &audio_sample_rate
    id: audio_sample_rate
    type: "radio"
    group: "audio"
    choice_style: "buttons"
    layout: "four_columns"
    span: "full"
    visible_if: {audio_mode: ["aac_320", "mp3", "flac", "pcm_s16", "pcm_s24", "pcm_f32"]}
    label: "Sample rate"
    label_ru: "Частота дискретизации"
    default: "source"
    options:
      - {value: "source", label: "COPY", label_ru: "COPY"}
      - {value: "44100", label: "44.1 kHz", label_ru: "44.1 kHz"}
      - {value: "48000", label: "48 kHz", label_ru: "48 kHz"}
      - {value: "88200", label: "88.2 kHz", label_ru: "88.2 kHz"}
      - {value: "96000", label: "96 kHz", label_ru: "96 kHz"}
      - {value: "176400", label: "176.4 kHz", label_ru: "176.4 kHz"}
      - {value: "192000", label: "192 kHz", label_ru: "192 kHz"}

  cpu_encoder_preset: &cpu_encoder_preset
    id: cpu_encoder_preset
    type: "radio"
    choice_style: "buttons"
    layout: "five_columns"
    label: "CPU preset"
    label_ru: "CPU preset"
    tooltip: "Software x264/x265 speed-compression preset. Slower presets spend more CPU searching for a cleaner/smaller encode at the same CRF."
    tooltip_ru: "Software x264/x265 preset скорости/сжатия. Более медленные presets тратят больше CPU на более чистое/компактное кодирование при том же CRF."
    default: "medium"
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    options:
      - {value: "fast", label: "fast", label_ru: "fast", tooltip: "Faster CPU encode; useful for review or quick tests.", tooltip_ru: "Быстрее на CPU; удобно для просмотровых файлов и быстрых тестов."}
      - {value: "medium", label: "medium", label_ru: "medium", tooltip: "Balanced x264/x265 default-style preset.", tooltip_ru: "Сбалансированный preset в духе стандартного x264/x265."}
      - {value: "slow", label: "slow", label_ru: "slow", tooltip: "Good production default when time is acceptable.", tooltip_ru: "Хороший рабочий вариант, когда время кодирования приемлемо."}
      - {value: "slower", label: "slower", label_ru: "slower", tooltip: "More CPU search for difficult material or final storage masters.", tooltip_ru: "Больше CPU-поиска для сложного материала или финального хранения."}
      - {value: "veryslow", label: "veryslow", label_ru: "veryslow", tooltip: "Maximum x264/x265 preset effort; often diminishing returns.", tooltip_ru: "Максимальное усилие x264/x265 preset; часто с убывающей отдачей."}

  nvenc_preset: &nvenc_preset
    id: nvenc_preset
    type: "radio"
    choice_style: "buttons"
    layout: "three_columns"
    label: "NVENC preset"
    label_ru: "NVENC preset"
    tooltip: "NVIDIA NVENC P-preset. This is a hardware encoder scale, not an equivalent of CPU slow/slower/veryslow."
    tooltip_ru: "NVIDIA NVENC P-preset. Это шкала аппаратного кодера, не эквивалент CPU slow/slower/veryslow."
    default: "p6"
    visible_if: {encode_backend: "cuda"}
    options:
      - {value: "p5", label: "NVENC p5", label_ru: "NVENC p5", tooltip: "Good quality; useful for faster GPU delivery/review encodes.", tooltip_ru: "Good quality; быстрый GPU-вариант для delivery/review."}
      - {value: "p6", label: "NVENC p6", label_ru: "NVENC p6", tooltip: "Better quality; good upper default for careful NVENC encodes.", tooltip_ru: "Better quality; хороший верхний default для аккуратного NVENC."}
      - {value: "p7", label: "NVENC p7", label_ru: "NVENC p7", tooltip: "Best quality in the NVENC P-scale; slower on GPU.", tooltip_ru: "Best quality в NVENC P-scale; медленнее на GPU."}

  qsv_encoder_preset: &qsv_encoder_preset
    id: qsv_encoder_preset
    type: "radio"
    choice_style: "buttons"
    layout: "seven_columns"
    span: "full"
    label: "QSV preset"
    label_ru: "QSV preset"
    tooltip: "Intel QuickSync preset. QSV has its own preset line exposed by FFmpeg: veryfast, faster, fast, medium, slow, slower, veryslow."
    tooltip_ru: "Intel QuickSync preset. У QSV своя FFmpeg-линейка: veryfast, faster, fast, medium, slow, slower, veryslow."
    default: "medium"
    visible_if: {encode_backend: "qsv"}
    options:
      - {value: "veryfast", label: "veryfast", label_ru: "veryfast", tooltip: "Fastest QSV preset.", tooltip_ru: "Самый быстрый QSV preset."}
      - {value: "faster", label: "faster", label_ru: "faster", tooltip: "Faster QSV preset.", tooltip_ru: "Быстрый QSV preset."}
      - {value: "fast", label: "fast", label_ru: "fast", tooltip: "Fast QSV preset with more quality headroom than veryfast/faster.", tooltip_ru: "Быстрый QSV preset с большим запасом качества, чем veryfast/faster."}
      - {value: "medium", label: "medium", label_ru: "medium", tooltip: "Balanced QSV preset.", tooltip_ru: "Сбалансированный QSV preset."}
      - {value: "slow", label: "slow", label_ru: "slow", tooltip: "Higher quality QSV preset.", tooltip_ru: "Более качественный QSV preset."}
      - {value: "slower", label: "slower", label_ru: "slower", tooltip: "More careful QSV preset.", tooltip_ru: "Более тщательный QSV preset."}
      - {value: "veryslow", label: "veryslow", label_ru: "veryslow", tooltip: "Maximum QSV preset effort exposed by FFmpeg.", tooltip_ru: "Максимальное усилие QSV preset, доступное через FFmpeg."}

  amf_quality: &amf_quality
    id: amf_quality
    type: "radio"
    choice_style: "buttons"
    layout: "three_columns"
    label: "AMF quality"
    label_ru: "AMF quality"
    tooltip: "AMD AMF quality preset. This controls AMF's speed/balanced/quality mode; CQ/QP still controls quantization level."
    tooltip_ru: "AMD AMF quality preset. Управляет AMF режимом speed/balanced/quality; CQ/QP по-прежнему задаёт уровень квантования."
    default: "quality"
    visible_if: {encode_backend: "amd"}
    options:
      - {value: "speed", label: "speed", label_ru: "speed", tooltip: "Prefer AMF encoding speed.", tooltip_ru: "Приоритет скорости AMF."}
      - {value: "balanced", label: "balanced", label_ru: "balanced", tooltip: "Balanced AMF quality/speed mode.", tooltip_ru: "Сбалансированный режим AMF качество/скорость."}
      - {value: "quality", label: "quality", label_ru: "quality", tooltip: "Prefer AMF quality.", tooltip_ru: "Приоритет качества AMF."}

  pix_fmt: &pix_fmt
    id: pix_fmt
    type: "select"
    label: "Pixel format"
    label_ru: "Pixel format"
    default: "auto"
    options:
      - {value: "auto", label: "auto", label_ru: "auto"}
      - {value: "yuv420p", label: "yuv420p", label_ru: "yuv420p"}
      - {value: "yuv420p10le", label: "yuv420p10le", label_ru: "yuv420p10le"}
      - {value: "yuv422p", label: "yuv422p", label_ru: "yuv422p"}
      - {value: "yuv422p10le", label: "yuv422p10le", label_ru: "yuv422p10le"}

  output_resolution: &output_resolution
    id: output_resolution
    type: "select"
    label: "Resolution"
    label_ru: "Разрешение"
    default: "source"
    options:
      - {value: "source", label: "Source", label_ru: "Исходное"}
      - {value: "2160", label: "2160p", label_ru: "2160p"}
      - {value: "1440", label: "1440p", label_ru: "1440p"}
      - {value: "1080", label: "1080p", label_ru: "1080p"}
      - {value: "720", label: "720p", label_ru: "720p"}
      - {value: "480", label: "480p", label_ru: "480p"}

  output_container: &output_container
    id: output_container
    type: "radio"
    choice_style: "buttons"
    layout: "three_columns"
    label: "Container"
    label_ru: "Контейнер"
    default: "mp4"
    span: "full"
    refresh_on_change: true
    options:
      - {value: "mp4", label: "MP4", label_ru: "MP4"}
      - {value: "mkv", label: "MKV", label_ru: "MKV"}
      - {value: "mov", label: "MOV", label_ru: "MOV"}

  editing_output_container: &editing_output_container
    id: output_container
    type: "radio"
    choice_style: "buttons"
    layout: "two_columns"
    label: "Container"
    label_ru: "Контейнер"
    default: "mov"
    span: "full"
    refresh_on_change: true
    options:
      - {value: "mov", label: "MOV", label_ru: "MOV"}
      - {value: "mxf", label: "MXF", label_ru: "MXF"}

  crf: &crf
    id: crf
    type: "number"
    label: "CRF"
    label_ru: "CRF"
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    default: 14
    min: 0
    max: 40
    step: 1

  cq: &cq
    id: cq
    type: "number"
    label: "CQ/QP"
    label_ru: "CQ/QP"
    visible_if: {encode_backend: ["cuda", "qsv", "amd"]}
    default: 14
    min: 0
    max: 40
    step: 1

  av1_preset: &av1_preset
    id: av1_preset
    type: "select"
    label: "SVT-AV1 preset"
    label_ru: "SVT-AV1 preset"
    tooltip: "Software SVT-AV1 speed/quality preset. Hardware AV1 encoders use their own NVENC/QSV/AMF scales instead."
    tooltip_ru: "Preset скорости/качества software SVT-AV1. Аппаратные AV1-кодеры используют свои шкалы NVENC/QSV/AMF."
    default: "6"
    visible_if: {target_codecs: ["svt_av1"]}
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    options:
      - {value: "4", label: "4 quality", label_ru: "4 quality"}
      - {value: "6", label: "6 balanced", label_ru: "6 balanced"}
      - {value: "8", label: "8 fast", label_ru: "8 fast"}

  overwrite: &overwrite
    id: overwrite
    type: "checkbox"
    label: "Overwrite"
    label_ru: "Перезаписывать"
    default: false

  limit_first_file: &limit_first_file
    id: limit_first_file
    type: "checkbox"
    label: "Test on first file"
    label_ru: "Тест: первый файл"
    hint: "Process only the first matching file, useful for checking a preset before a full batch."
    hint_ru: "Обработать только первый найденный файл, удобно для проверки пресета перед всей папкой."
    default: false

  dry_run: &dry_run
    id: dry_run
    type: "checkbox"
    label: "Dry run"
    label_ru: "Только показать команду"
    default: false

operations:
  - id: inventory
    title: "Inventory"
    title_ru: "Инвентаризация"
    description: "Count project folders."
    description_ru: "Посчитать Source, Transcoded, Download и LUTs."
    service: "system_core.services.media_service:inventory"
    kind: "safe"

  - id: selftest
    title: "Selftest"
    title_ru: "Самопроверка"
    description: "Check ffmpeg, ffprobe, yt-dlp and Deno."
    description_ru: "Проверить ffmpeg, ffprobe, yt-dlp и Deno."
    service: "system_core.services.media_service:selftest"
    kind: "safe"

operation_groups:
  - id: youtube
    title: "Download / YouTube"
    title_ru: "Скачивание / YouTube"
    description: "Native yt-dlp profiles, no download archive by default."
    description_ru: "Нативные профили yt-dlp, архив скачиваний по умолчанию выключен."
    fields:
      - id: youtube_preset
        type: "profile_select"
        label: "Download profile"
        label_ru: "Профиль скачивания"
        default: "best_video"
        presets:
          - id: best_video
            label: "Best MP4 video"
            label_ru: "Best MP4 video"
            description: "Best available MP4/M4A merge for general use."
            description_ru: "Лучшее доступное MP4/M4A для обычной загрузки."
            values:
              youtube_profile: "best_mp4"
              youtube_source_mode: "single"
              youtube_resolution: "best"
              youtube_video_codec: "auto"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_client: "default"
              youtube_options: ["safe_retries", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 8
              download_archive: false
          - id: upload_1080_avc
            label: "1080p AVC MP4"
            label_ru: "1080p AVC MP4"
            description: "YouTube-friendly 1080p AVC preference."
            description_ru: "Предпочтение 1080p AVC для совместимости и заливки."
            values:
              youtube_profile: "upload_ready"
              youtube_source_mode: "single"
              youtube_resolution: "1080"
              youtube_video_codec: "avc"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_options: ["safe_retries", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 8
              download_archive: false
          - id: safe_safari
            label: "Safe Safari"
            label_ru: "Safe Safari"
            description: "Slower Safari client, retries and IPv4 for fragile downloads."
            description_ru: "Медленный Safari-клиент, повторы и IPv4 для капризных ссылок."
            values:
              youtube_profile: "safe_mp4"
              youtube_source_mode: "single"
              youtube_resolution: "best"
              youtube_video_codec: "auto"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_client: "safari"
              youtube_options: ["safe_retries", "force_ipv4", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 1
              download_archive: false
          - id: av1_if_available
            label: "AV1 if available"
            label_ru: "AV1 если доступен"
            description: "Prefer AV1 video while keeping MP4 output."
            description_ru: "Предпочитать AV1-видео, оставляя MP4-контейнер."
            values:
              youtube_profile: "video_custom"
              youtube_source_mode: "single"
              youtube_resolution: "best"
              youtube_video_codec: "av1"
