  - id: raw
    title: "ProRes RAW development"
    title_ru: "Проявка ProRes RAW"
    description: "ProRes RAW developed on the video card as it was shot - the white balance and the colour matrix of the camera - by cineraw: ProRes 4444 or DNxHR 444 for editing, H.264 or H.265 for viewing, BT.709, the sound and the timecode of the source."
    description_ru: "ProRes RAW проявляется на видеокарте, как снято, - баланс белого и цветовая матрица камеры - программой cineraw: ProRes 4444 или DNxHR 444 для монтажа, H.264 или H.265 для просмотра, BT.709, звук и таймкод источника."
    fields:
      - id: raw_target
        tooltip: "What the developed clip is written into. ProRes 4444 and DNxHR 444 - 10-bit 4:4:4 for an editor, with the PCM sound of the source; H.264 and H.265 10-bit - a file to look at and send, AAC sound."
        tooltip_ru: "Во что пишется проявленный клип. ProRes 4444 и DNxHR 444 - 10 бит 4:4:4 для монтажа, со звуком PCM источника; H.264 и H.265 10 бит - файл посмотреть и отправить, звук AAC."
        type: "radio"
        choice_style: "buttons"
        layout: "four_columns"
        label: "Develop into"
        label_ru: "Проявить в"
        default: "prores4444"
        options:
          - {value: "prores4444", label: "ProRes 4444", label_ru: "ProRes 4444"}
          - {value: "dnxhr444", label: "DNxHR 444", label_ru: "DNxHR 444"}
          - {value: "h264", label: "H.264", label_ru: "H.264"}
          - {value: "h265", label: "H.265 10-bit", label_ru: "H.265 10 бит"}
      - id: raw_encoder
        tooltip: "The encoder of H.264 and H.265: the processor (x264, x265, CRF 16) or NVENC of an NVIDIA card (p6, CQ 16)."
        tooltip_ru: "Кодер H.264 и H.265: процессор (x264, x265, CRF 16) или NVENC видеокарты NVIDIA (p6, CQ 16)."
        type: "radio"
        choice_style: "buttons"
        layout: "two_columns"
        label: "Encoder"
        label_ru: "Кодер"
        default: "cpu"
        visible_if: {raw_target: ["h264", "h265"]}
        options:
          - {value: "cpu", label: "CPU", label_ru: "CPU"}
          - {value: "nvenc", label: "NVENC", label_ru: "NVENC"}
      - id: raw_workers
        tooltip: "How many pieces of a clip develop side by side, each by its own cineraw: the decode of ProRes RAW takes one core a piece, the video card develops a frame in milliseconds. Auto - half the cores, eight at most."
        tooltip_ru: "Сколько кусков клипа проявляются одновременно, каждый своим cineraw: декодирование ProRes RAW занимает по ядру на кусок, видеокарта проявляет кадр за миллисекунды. Авто - половина ядер, не больше восьми."
        type: "radio"
        choice_style: "buttons"
        layout: "five_columns"
        label: "Pieces at once"
        label_ru: "Кусков сразу"
        default: "auto"
        options:
          - {value: "auto", label: "Auto", label_ru: "Авто"}
          - {value: "2", label: "2", label_ru: "2"}
          - {value: "4", label: "4", label_ru: "4"}
          - {value: "8", label: "8", label_ru: "8"}
          - {value: "12", label: "12", label_ru: "12"}
      - *overwrite
      - *limit_first_file
      - *dry_run
    children:
      - id: raw_develop_run
        title: "Develop ProRes RAW"
        title_ru: "Проявить ProRes RAW"
        description: "Develop every ProRes RAW of the Source on the video card into the chosen format."
        description_ru: "Проявить каждый ProRes RAW Источника на видеокарте в выбранный формат."
        service: "system_core.services.raw_develop:develop_raw"
        kind: "safe"

  - id: remux
    title: "Package / remux"
    title_ru: "Упаковка / remux"
    description: "Change containers without re-encoding where possible."
    description_ru: "Менять контейнеры без перекодирования, где возможно."
    fields:
      - id: remux_stream_mode
        tooltip: "What goes into the new container without re-encoding: the picture, the sound, or both."
        tooltip_ru: "Что переносится в новый контейнер без перекодирования: картинка, звук или то и другое."
        type: "radio"
        group: "streams"
        choice_style: "buttons"
        layout: "three_columns"
        span: "full"
        label: "Pipeline"
        label_ru: "Пайплайн"
        default: "video_audio"
        refresh_on_change: true
        options:
          - {value: "video", label: "Video", label_ru: "Video", tone: "copy", tooltip: "Keep video streams only and write them to the selected output container.", tooltip_ru: "Оставить только видеотреки и записать их в выбранный контейнер."}
          - {value: "audio", label: "Audio", label_ru: "Audio", tone: "copy", tooltip: "Extract/copy audio streams to the selected audio container.", tooltip_ru: "Отделить/скопировать аудиотреки в выбранный аудиоконтейнер."}
          - {value: "video_audio", label: "Video&Audio", label_ru: "Video&Audio", tone: "copy", tooltip: "Copy video and audio streams together into one output container.", tooltip_ru: "Скопировать видео и аудио вместе в один выходной контейнер."}
      - id: remux_target_format
        tooltip: "The new container. A file whose codec the container cannot hold is passed over with the reason - the check reads the codec, not the container alone."
        tooltip_ru: "Новый контейнер. Файл, кодек которого контейнер не примет, пропускается с причиной - проверка смотрит на кодек, а не только на контейнер."
        type: "remux_format"
        group: "package"
        span: "full"
        columns: 4
        label: "Output container"
        label_ru: "Контейнер вывода"
        default: "mp4"
        visible_if: {remux_stream_mode: ["video", "video_audio"]}
        options:
          - {value: "mp4", label: "MP4", label_ru: "MP4"}
          - {value: "mov", label: "MOV", label_ru: "MOV"}
          - {value: "mkv", label: "MKV", label_ru: "MKV"}
          - {value: "mxf", label: "MXF", label_ru: "MXF"}
      - id: remux_orientation
        type: "radio"
        choice_style: "buttons"
        # Two rows of three rather than one row of six: at six columns the
        # longest label was clipped by six pixels, and the Russian ones are
        # longer still.
        layout: "three_columns"
        group: "package"
        span: "full"
        label: "Which way up"
        label_ru: "Как разворачивать"
        default: "none"
        visible_if: {remux_stream_mode: ["video", "video_audio"]}
        tooltip: "Writes into the container how the picture should be shown. Nothing is decoded and nothing is re-encoded - the pixels are copied and one header field changes. Offered for H.264 and HEVC camera originals; MP4, MOV and MKV keep it, MXF does not, and the section refuses rather than writing an unturned file."
        tooltip_ru: "Записывает в контейнер, как показывать картинку. Ничего не декодируется и не перекодируется — пиксели копируются, меняется одно поле в заголовке. Предлагается для камерных H.264 и HEVC; MP4, MOV и MKV это хранят, MXF нет — и раздел откажет, а не выдаст неповёрнутый файл."
        options:
          - {value: "none", label: "As shot", label_ru: "Как снято", tone: "copy", tooltip: "Leave the orientation alone.", tooltip_ru: "Не трогать ориентацию."}
          - {value: "cw90", label: "90 clockwise", label_ru: "90 по часовой", tone: "copy", tooltip: "For a camera turned on its side: a 960x540 file is then shown as 540x960, and the editor opens it upright.", tooltip_ru: "Для камеры, повёрнутой набок: файл 960x540 показывается как 540x960, и монтажка открывает его вертикально."}
          - {value: "ccw90", label: "90 counter-cw", label_ru: "90 против часовой", tone: "copy", tooltip: "The same turn the other way, for a camera laid on its other side.", tooltip_ru: "Тот же поворот в другую сторону — камера легла на другой бок."}
          - {value: "turn180", label: "Upside down", label_ru: "Перевернуть", tone: "copy", tooltip: "For a camera that filmed inverted - hung under a gimbal, mounted on a rig, or overhead. The whole take comes back the right way up in the editor.", tooltip_ru: "Для камеры, снимавшей вверх ногами: подвешенной под стабилизатором, закреплённой на риге или сверху. Весь дубль встанет в монтажке правильно."}
          - {value: "hflip", label: "Mirror left-right", label_ru: "Зеркало по горизонтали", tone: "copy", tooltip: "For a shot filmed through a mirror rig, or a selfie-facing camera.", tooltip_ru: "Для съёмки через зеркальный риг или фронтальной камерой."}
          - {value: "vflip", label: "Mirror top-bottom", label_ru: "Зеркало по вертикали", tone: "copy", tooltip: "Rarely wanted on its own; some optical rigs need it.", tooltip_ru: "Редко нужно само по себе, но некоторые оптические риги требуют."}
      - id: remux_audio_target_format
        tooltip: "The file the sound goes into, without re-encoding. MKA takes any sound; the others their own codecs - M4A AAC and ALAC, WAV PCM."
        tooltip_ru: "Файл, в который уходит звук без перекодирования. MKA принимает любой звук, остальные - свои кодеки: M4A - AAC и ALAC, WAV - PCM."
        type: "remux_format"
        group: "package"
        span: "full"
        columns: 6
        label: "Audio output container"
        label_ru: "Аудиоконтейнер вывода"
        default: "mka"
        visible_if: {remux_stream_mode: "audio"}
        options:
          - {value: "m4a", label: "M4A", label_ru: "M4A"}
          - {value: "alac", label: "ALAC", label_ru: "ALAC"}
          - {value: "mka", label: "MKA", label_ru: "MKA"}
          - {value: "aac", label: "AAC", label_ru: "AAC"}
          - {value: "ac3", label: "AC3", label_ru: "AC3"}
          - {value: "eac3", label: "EAC3", label_ru: "EAC3"}
          - {value: "dts", label: "DTS", label_ru: "DTS"}
          - {value: "flac", label: "FLAC", label_ru: "FLAC"}
          - {value: "wav", label: "WAV", label_ru: "WAV"}
          - {value: "mp3", label: "MP3", label_ru: "MP3"}
          - {value: "opus", label: "OPUS", label_ru: "OPUS"}
          - {value: "ogg", label: "OGG", label_ru: "OGG"}
      - <<: *overwrite
        group: "run"
      - <<: *limit_first_file
        group: "run"
      - <<: *dry_run
        group: "run"
    children:
      - id: remux_run
        title: "Run remux"
        title_ru: "Запустить remux"
        description: "Run selected packaging operation."
        description_ru: "Выполнить выбранную упаковку."
        service: "system_core.services.media_service:remux_media"
        kind: "safe"

  - id: subtitles
    title: "Subtitles"
    title_ru: "Субтитры"
    description: "Take the subtitle streams out of the videos as they are."
    description_ru: "Вынуть потоки субтитров из видео как есть."
    fields:
      - <<: *overwrite
        group: "run"
      - <<: *limit_first_file
        group: "run"
      - <<: *dry_run
        group: "run"
    children:
      - id: subtitles_extract
        title: "Take subtitles out"
        title_ru: "Вынуть субтитры"
        description: "Every subtitle stream of a video, copied as it is into an MKS file beside its name; a video without subtitles is passed over."
        description_ru: "Все потоки субтитров видео, скопированные как есть в файл MKS с его именем; видео без субтитров пропускается."
        service: "system_core.services.media_service:extract_subtitles"
        kind: "safe"

  - id: trim
    title: "Trim"
    title_ru: "Обрезка"
    description: "Cut camera footage without re-encoding, and sound files on the exact sample."
    description_ru: "Резать материал с камеры без перекодирования, а звуковые файлы — ровно по сэмплу."
    fields:
      - id: trim_file
        # A badge with an arrow on each side: a folder of takes is walked, not
        # searched, and the name is on screen without opening anything.
        type: "trim_file_pick"
        options_source: "system_core.services.media_service:trim_source_file_names"
        cache_seconds: 5
        group: "trim"
        span: "full"
        label: "File to trim"
        label_ru: "Какой файл резать"
        tooltip: "The video and sound files staged in Source, alphabetically. One file is trimmed at a time: takes rarely share a keyframe, let alone a cut point."
        tooltip_ru: "Видео- и звуковые файлы из Источника по алфавиту. Режется один файл за раз: у дублей редко совпадают ключевые кадры, не говоря о точках реза."
        default: ""
      - id: trim_action
        tooltip: "What happens to the piece between the points: it is kept, it is cut out and the ends are joined, or the file is split at the points."
        tooltip_ru: "Что делается с куском между точками: он остаётся, он вырезается и концы сшиваются, или файл делится по точкам."
        type: "radio"
        choice_style: "buttons"
        layout: "three_columns"
        group: "trim"
        span: "full"
        label: "What to do with the piece between the points"
        label_ru: "Что сделать с куском между точками"
        default: "keep"
        refresh_on_change: true
        options:
          - {value: "keep", label: "Keep it", label_ru: "Оставить", tone: "copy", tooltip: "Keeps what lies between the points and drops the rest. Which end goes is already in the fields: IN alone drops the head, OUT alone drops the tail, both drop both ends. Each row added with + is a variant of its own, written to its own file: _keep01, _keep02.", tooltip_ru: "Оставляет то, что между точками, остальное уходит. Какой край уйдёт, уже сказано полями: один IN — уходит начало, один OUT — конец, обе точки — оба края. Каждая строка, добавленная плюсом, — отдельный вариант в своём файле: _keep01, _keep02."}
          - {value: "cut", label: "Cut it out", label_ru: "Вырезать", tone: "copy", tooltip: "The opposite: the piece between IN and OUT goes and the two ends are joined into one file. The tail starts at the first keyframe past OUT - starting earlier would leave part of the removed piece in - and the log says how much more than asked for went. A sound file loses exactly the piece between the points. Each row added with + is a variant of its own: one piece cut out of the whole take, in its own file - _cut01, _cut02.", tooltip_ru: "Наоборот: кусок между IN и OUT уходит, а начало и конец склеиваются в один файл. Хвост начинается с первого ключевого кадра после OUT — раньше нельзя, иначе часть вырезаемого останется, — и журнал говорит, насколько больше запрошенного ушло. У звукового файла уходит ровно кусок между точками. Каждая строка, добавленная плюсом, — отдельный вариант: из целого дубля вырезан один кусок, в своём файле — _cut01, _cut02."}
          - {value: "split", label: "Split", label_ru: "Разделить", tone: "copy", tooltip: "Nothing is discarded. N points cut the file into N + 1 parts: _part1, _part2 and on, _part01 from ten parts. Each point moves to its nearest keyframe and the parts meet there, so they add back up to the original frame for frame. A sound file splits on the exact sample.", tooltip_ru: "Ничего не выбрасывается. N точек режут файл на N + 1 частей: _part1, _part2 и дальше, с десяти частей — _part01. Каждая точка сдвигается к ближайшему ключевому кадру, и части стыкуются в нём — вместе они дают исходник кадр в кадр. Звуковой файл делится ровно по сэмплу.", hint: "Take the points one after another, walking forward through the take; + adds the next one.", hint_ru: "Берите точки одну за другой, двигаясь по дублю вперёд; плюс добавляет следующую."}
      - id: trim_start
        # Row 1 of the rows below: drawn by trim_rows, carried to the engine from here.
        hidden: true
        type: "text"
        group: "trim"
        label: "IN - start of the kept piece"
        label_ru: "IN — начало куска"
        placeholder: "00:00:05,000"
        tooltip: "Wall-clock position, written as 00:01:28,4 or as plain seconds. The head of a copied stream lands on the nearest keyframe before this point, and the log says where it actually went. A sound file is cut on the exact sample."
        tooltip_ru: "Позиция по реальному времени: 00:01:28,4 или просто секунды. Начало копируемого потока ложится на ближайший ключевой кадр перед этой точкой, и журнал говорит, куда оно попало. Звуковой файл режется ровно по сэмплу."
        default: ""
      - id: trim_end
        hidden: true
        type: "text"
        group: "trim"
        label: "OUT - end of the kept piece"
        label_ru: "OUT — конец куска"
        placeholder: "00:00:30,000"
        tooltip: "The tail is counted in frames from the exact rate, so it lands on the frame asked for. A sound file: on the exact sample."
        tooltip_ru: "Конец считается кадрами по точной дроби частоты, поэтому попадает ровно в запрошенный кадр. У звукового файла — ровно по сэмплу."
        default: ""
      - id: trim_rows
        tooltip: "The points, in hours, minutes, seconds and milliseconds: 00:01:02,500. Each row added with + is written to a file of its own."
        tooltip_ru: "Точки - часы, минуты, секунды и миллисекунды: 00:01:02,500. Каждая строка, добавленная кнопкой +, пишется в свой файл."
        # Draws IN and OUT as row 1 and holds the rows after it: each row of a
        # keep or a cut is a run of its own. For a split it draws the points.
        type: "trim_rows"
        group: "trim"
        span: "full"
        label: "Points"
        label_ru: "Точки"
        default: []
        add_tooltip: "Add the next variant: one more piece to keep or to cut out, written to a file of its own. Rows may overlap. Lights up once the last row holds its points; it also clears the A and B points in the player, so the next piece is looked for from scratch."
        add_tooltip_ru: "Добавить следующий вариант: ещё один кусок, который оставляется или вырезается, в своём файле. Строки могут пересекаться. Загорается, когда в последней строке взяты точки; заодно сбрасывает точки A и B в плеере, чтобы следующий кусок искать с чистого листа."
        add_point_tooltip: "Add the next point of the split. Lights up once the last point is taken; it also clears the A and B points in the player."
        add_point_tooltip_ru: "Добавить следующую точку разреза. Загорается, когда последняя точка взята; заодно сбрасывает точки A и B в плеере."
        point_tooltip: "Where the file is cut, written as 00:01:28,4 or as plain seconds. The point moves to its nearest keyframe; a sound file is cut on the exact sample. The player writes into the last field, and only past the points before it."
        point_tooltip_ru: "Где резать файл: 00:01:28,4 или просто секунды. Точка сдвигается к ближайшему ключевому кадру, звуковой файл режется ровно по сэмплу. Плеер пишет в последнее поле и только дальше предыдущих точек."
      - id: trim_points
        # The points of a split, written by trim_rows; a wrapper's IN and OUT split when this is empty.
        hidden: true
        type: "text"
        group: "trim"
        label: "Split points"
        label_ru: "Точки разреза"
        default: []
      - id: trim_player
        type: "mpv_transport"
        group: "trim"
        span: "full"
        label: "Player - find the points"
        label_ru: "Плеер — найти точки"
        tooltip: "Opens the take in mpv. There, `l` sets the A point and `l` again sets B; the piece between them plays in a loop, so the cut is heard before it is written. `,` and `.` step one frame, `b` plays backwards. Then bring A and B here."
        tooltip_ru: "Открывает дубль в mpv. Там `l` ставит точку A, второе нажатие — B; кусок между ними играет по кругу, и рез слышно до того, как он сделан. `,` и `.` — шаг в кадр, `b` — воспроизведение назад. Дальше перенести A и B сюда."
        options:
          - value: "open"
            label: "Open in the player"
            label_ru: "Открыть в плеере"
            tooltip: "Shows the file chosen above. The window stays open between takes, so it can live on a second monitor."
            tooltip_ru: "Показывает выбранный выше файл. Окно остаётся между дублями — его можно держать на втором мониторе."
          - value: "both"
            hidden_if: {trim_action: "split"}
            label: "Take A and B"
            label_ru: "Взять A и B"
            tooltip: "The loop set in the player becomes IN and OUT of the last row here, to the millisecond."
            tooltip_ru: "Петля, поставленная в плеере, становится здесь IN и OUT последней строки, до миллисекунды."
          - value: "mark_in"
            hidden_if: {trim_action: "split"}
            label: "Mark IN"
            label_ru: "Отметить IN"
            tooltip: "Takes the position the player stands at, writes it into IN of the last row, and moves the player's A point there - so the piece keeps looping and a wrong point is heard at once."
            tooltip_ru: "Берёт позицию, на которой стоит плеер, пишет её в IN последней строки и переносит туда точку A — кусок продолжает играть по кругу, и неверная точка слышна сразу."
          - value: "mark_out"
            hidden_if: {trim_action: "split"}
            label: "Mark OUT"
            label_ru: "Отметить OUT"
            tooltip: "The same for the end of the piece: the position becomes OUT of the last row and the player's B point."
            tooltip_ru: "То же для конца куска: позиция становится OUT последней строки и точкой B в плеере."
          - value: "take_a"
            visible_if: {trim_action: "split"}
            label: "Take A"
            label_ru: "Взять A"
            tooltip: "The A point set in the player with `l` becomes the last split point here - only if it lies past the points before it."
            tooltip_ru: "Точка A, поставленная в плеере клавишей `l`, становится здесь последней точкой разреза — только если она дальше предыдущих."
          - value: "mark_point"
            visible_if: {trim_action: "split"}
            label: "Mark here"
            label_ru: "Отметить здесь"
            tooltip: "The position the player stands at becomes the last split point - only past the points before it. A slider dragged back by accident changes nothing."
            tooltip_ru: "Позиция, на которой стоит плеер, становится последней точкой разреза — только дальше предыдущих. Ползунок, случайно отведённый назад, ничего не испортит."
          - value: "close"
            label: "Close the player"
            label_ru: "Закрыть плеер"
            tooltip: "Closes the window. It also closes by itself when the program stops."
            tooltip_ru: "Закрывает окно. Оно и само закроется, когда программа остановится."
      - id: trim_container
        tooltip: "The container of the piece. As is keeps the camera's own."
        tooltip_ru: "Контейнер куска. «Как есть» оставляет контейнер камеры."
        # A sound file is written by format instead: see trim_audio_format.
        hidden_if: {trim_media_kind: "audio"}
        type: "radio"
        choice_style: "buttons"
        layout: "five_columns"
        group: "package"
        span: "full"
        label: "Output container"
        label_ru: "Контейнер вывода"
        default: "source"
        options:
          - {value: "source", label: "As is", label_ru: "Как есть", tooltip: "Keep the container the camera wrote.", tooltip_ru: "Оставить контейнер, в котором снято."}
          - {value: "mp4", label: "MP4", label_ru: "MP4", tooltip: "MOV from the camera into MP4 for the edit suite, without a single re-encode.", tooltip_ru: "MOV с камеры в MP4 для монтажной, без единого пережатия."}
          - {value: "mov", label: "MOV", label_ru: "MOV", tooltip: "The safe home for ProRes and for camera PCM audio.", tooltip_ru: "Надёжный дом для ProRes и камерного PCM."}
          - {value: "mkv", label: "MKV", label_ru: "MKV", tooltip: "Takes anything, but keeps a timecode only as a text tag. Editors may not read it.", tooltip_ru: "Примет что угодно, но таймкод хранит текстовым тегом — монтажка может его не прочитать."}
          - {value: "mxf", label: "MXF", label_ru: "MXF", tooltip: "Premiere's own working format. PCM audio is rewritten sample-accurately, so the picture and the sound stay exactly where they were. Compressed audio — AAC, AC-3, MP3, FLAC, ALAC — MXF refuses outright; those files are skipped with the reason, and MOV takes them unchanged.", tooltip_ru: "Рабочий формат Premiere. Звук PCM переписывается сэмпл-в-сэмпл, картинка и звук остаются ровно там, где были. Сжатый звук — AAC, AC-3, MP3, FLAC, ALAC — MXF не принимает вовсе: такой файл будет пропущен с объяснением, а MOV возьмёт его как есть."}
      - id: trim_audio
        tooltip: "The sound of the piece: copied as it is, or dropped."
        tooltip_ru: "Звук куска: копируется как есть или убирается."
        hidden_if: {trim_media_kind: "audio"}
        type: "radio"
        choice_style: "buttons"
        layout: "two_columns"
        group: "package"
        span: "full"
        label: "Audio"
        label_ru: "Звук"
        default: "copy"
        refresh_on_change: true
        options:
          - {value: "copy", label: "Copy", label_ru: "Копировать", tone: "copy", tooltip: "The track is copied as it is, without a generation loss.", tooltip_ru: "Дорожка копируется как есть, без потери поколения."}
          - {value: "none", label: "Drop", label_ru: "Убрать", tooltip: "A silent file for the edit or for a GIF.", tooltip_ru: "Немой файл для монтажа или для гифки."}
      - id: trim_audio_channel
        tooltip: "Which channels of the sound go into the piece: both, one of the two, or both folded to mono."
        tooltip_ru: "Какие каналы звука идут в кусок: оба, один из двух или оба, сведённые в моно."
        hidden_if: {trim_media_kind: "audio"}
        type: "radio"
        choice_style: "buttons"
        layout: "four_columns"
        group: "package"
        span: "full"
        label: "Audio channel"
        label_ru: "Канал звука"
        default: "both"
        visible_if: {trim_audio: "copy"}
        options:
          - {value: "both", label: "Both", label_ru: "Оба", tone: "copy", tooltip: "Copy the track untouched.", tooltip_ru: "Копировать дорожку нетронутой."}
          - {value: "first", label: "First", label_ru: "Первый", tooltip: "Usually the shotgun. Rebuilds the track: free on PCM, a generation on AAC.", tooltip_ru: "Обычно пушка. Дорожка пересобирается: на PCM бесплатно, на AAC — потеря поколения."}
          - {value: "second", label: "Second", label_ru: "Второй", tooltip: "Usually the lav. Rebuilds the track: free on PCM, a generation on AAC.", tooltip_ru: "Обычно петличка. Дорожка пересобирается: на PCM бесплатно, на AAC — потеря поколения."}
          - {value: "mono", label: "Fold to mono", label_ru: "Свести в моно", tooltip: "Mix both channels into one.", tooltip_ru: "Смешать оба канала в один."}
      - id: trim_exact
        # A sound file only: two modes of a cut (the owner, 15.10.2026: "переключатель: lossy-резка (точно) и
        # lossless"). Exact (true): decoded, cut on the sample, written in the format below - a compressed sound is
        # encoded once more. Lossless (false): compressed packets copied untouched, each point moved to a packet
        # boundary - what that costs at a joint was measured per codec. WAV, FLAC, ALAC, AIFF: on the sample either way.
        # Lossless by default (the owner, 15.10.2026): an AAC cut exactly was encoded once more, and that is what the
        # owner met as "AAC is not cut without loss".
        type: "radio"
        choice_style: "buttons"
        group: "package"
        label: "Cut"
        label_ru: "Резка"
        default: false
        refresh_on_change: true
        visible_if: {trim_media_kind: "audio"}
        options:
          - {value: true, label: "Exact", label_ru: "Точно", tone: "lossy",
             tooltip: "Cut on the exact sample. A compressed sound - AAC, MP3, Opus, Vorbis - is decoded and encoded once more: one generation of loss. WAV, FLAC, ALAC and AIFF lose nothing.",
             tooltip_ru: "Ровно по сэмплу. Сжатый звук - AAC, MP3, Opus, Vorbis - декодируется и кодируется заново: одно поколение потерь. WAV, FLAC, ALAC и AIFF ничего не теряют."}
          - {value: false, label: "Lossless", label_ru: "Без потерь", tone: "lossless",
             tooltip: "Nothing is decoded: the compressed packets are copied untouched, each point moves to the nearest packet boundary - for AAC 1024 samples, about 21 ms at 48 kHz - and the log says what the codec loses at a joint. WAV, FLAC, ALAC and AIFF are cut on the sample.",
             tooltip_ru: "Ничего не декодируется: сжатые пакеты копируются нетронутыми, точка уходит к ближайшей границе пакета - у AAC это 1024 сэмпла, около 21 мс при 48 кГц, - а журнал говорит, что кодек теряет на стыке. WAV, FLAC, ALAC и AIFF режутся по сэмплу."}
        tooltip: "How a sound file is cut: exactly on the sample, a compressed sound encoded once more, or without loss, the compressed packets copied as they are and the points moved to packet boundaries."
        tooltip_ru: "Как режется звуковой файл: ровно по сэмплу, со сжатым звуком, закодированным заново, или без потерь - сжатые пакеты копируются как есть, а точки уходят к границам пакетов."
      - id: trim_audio_format
        tooltip: "The format a piece of a sound file is written in. As is keeps the source's, sample for sample where it is lossless."
        tooltip_ru: "Формат, в котором пишется кусок звукового файла. «Как есть» - формат источника, сэмпл в сэмпл, где он без потерь."
        type: "radio"
        choice_style: "buttons"
        layout: "four_columns"
        group: "package"
        span: "full"
        label: "Format of the piece"
        label_ru: "Формат куска"
        default: "source"
        refresh_on_change: true
        visible_if: {all: [{trim_media_kind: "audio"}, {trim_exact: true}]}
        options:
          - {value: "source", label: "As is", label_ru: "Как есть", tooltip: "WAV, FLAC, ALAC, WavPack and AIFF go back as they were, sample for sample. MP3, AAC, Opus and Vorbis are encoded once more at the source's bitrate - one generation; WAV or FLAC avoid it.", tooltip_ru: "WAV, FLAC, ALAC, WavPack и AIFF записываются как были, сэмпл в сэмпл. MP3, AAC, Opus и Vorbis кодируются ещё раз с битрейтом исходника — одно поколение; WAV или FLAC его не тратят."}
          - {value: "wav", label: "WAV", label_ru: "WAV", tooltip: "The decoded sound at the source's own bit depth; a compressed source is kept as float, exactly as it decodes.", tooltip_ru: "Декодированный звук с разрядностью исходника; сжатый исходник хранится во float — ровно так, как декодируется."}
          - {value: "flac", label: "FLAC", label_ru: "FLAC", tooltip: "Lossless and smaller. Holds up to 24 bits: a float or 32-bit source is stored at 24, and the log says so.", tooltip_ru: "Без потерь и компактнее. Держит до 24 бит: float или 32-битный исходник хранится в 24, и журнал об этом скажет."}
          - {value: "alac", label: "ALAC", label_ru: "ALAC", tooltip: "Lossless in M4A, for Apple software. Up to 24 bits, like FLAC.", tooltip_ru: "Без потерь в M4A — для программ Apple. До 24 бит, как FLAC."}
          - {value: "m4a", label: "M4A / AAC", label_ru: "M4A / AAC", tooltip: "AAC at the bitrate below.", tooltip_ru: "AAC с битрейтом ниже."}
          - {value: "mp3", label: "MP3", label_ru: "MP3", tooltip: "LAME with the preset below. Up to 48 kHz: a higher rate goes to 48 kHz through soxr.", tooltip_ru: "LAME с пресетом ниже. До 48 кГц: частота выше приводится к 48 кГц через soxr."}
          - {value: "opus", label: "Opus", label_ru: "Opus", tooltip: "Opus at the bitrate below, at most 256 kbps. Opus works at 48 kHz: other rates go there through soxr.", tooltip_ru: "Opus с битрейтом ниже, не больше 256 kbps. Opus работает на 48 кГц: другие частоты приводятся к ней через soxr."}
      - id: trim_mp3_preset
        tooltip: "The LAME quality of a piece written as MP3."
        tooltip_ru: "Качество LAME для куска, записанного в MP3."
        type: "radio"
        choice_style: "buttons"
        layout: "three_columns"
        group: "package"
        span: "full"
        label: "MP3 / LAME"
        label_ru: "MP3 / LAME"
        default: "v0"
        refresh_on_change: true
        visible_if: {all: [{trim_media_kind: "audio"}, {trim_exact: true}, {trim_audio_format: "mp3"}]}
        options:
          - {value: "v0", label: "VBR V0", label_ru: "VBR V0", tooltip: "Best VBR V0 / Extreme, about 245 kbps.", tooltip_ru: "Best VBR V0 / Extreme, примерно 245 kbps."}
          - {value: "insane", label: "Insane 320", label_ru: "Insane 320", tooltip: "Insane CBR 320 kbps.", tooltip_ru: "Insane CBR 320 kbps."}
          - {value: "bitrate", label: "By bitrate", label_ru: "По битрейту", tooltip: "The bitrate below, up to the 320 kbps LAME ceiling.", tooltip_ru: "Битрейт ниже, максимум 320 kbps."}
      - id: trim_audio_bitrate
        tooltip: "The bitrate of a piece written as AAC, Opus (at most 256 kbps) or MP3 by bitrate (at most 320 kbps)."
        tooltip_ru: "Битрейт куска в AAC, Opus (не выше 256 кбит/с) или MP3 по битрейту (не выше 320 кбит/с)."
        type: "radio"
        choice_style: "buttons"
        layout: "four_columns"
        group: "package"
        span: "full"
        label: "Bitrate"
        label_ru: "Битрейт"
        default: "320k"
        visible_if:
          all:
            - {trim_media_kind: "audio"}
            - {trim_exact: true}
            - any:
                - {trim_audio_format: ["m4a", "opus"]}
                - {all: [{trim_audio_format: "mp3"}, {trim_mp3_preset: "bitrate"}]}
        options:
          - {value: "192k", label: "192 kbps", label_ru: "192 kbps"}
          - {value: "256k", label: "256 kbps", label_ru: "256 kbps"}
          - {value: "320k", label: "320 kbps", label_ru: "320 kbps", tooltip: "Opus stops at 256 kbps: above that it adds size, not sound.", tooltip_ru: "Opus останавливается на 256 kbps: выше растёт размер, а не звук."}
          - {value: "384k", label: "384 kbps", label_ru: "384 kbps", disabled_if: {trim_audio_format: ["mp3", "opus"]}}
      - id: trim_data
        hidden_if: {trim_media_kind: "audio"}
        type: "checkbox"
        group: "metadata"
        label: "Telemetry"
        label_ru: "Телеметрия"
        default: true
        tooltip: "Carries the file's data stream into the result - a GoPro writes its telemetry there, and it would otherwise vanish without a word. MOV and MP4 can hold one; MKV and MXF cannot, and the log says so before the run. A timecode track is left behind on purpose: it travels as a value instead. Cut it out does not carry the data stream through its join, and says so."
        tooltip_ru: "Переносит поток данных в результат — GoPro пишет туда телеметрию, и она иначе исчезает молча. MOV и MP4 такой поток держат, MKV и MXF нет — журнал скажет об этом до запуска. Дорожка таймкода намеренно остаётся: она переезжает значением. Вырезать не проносит поток данных через склейку и говорит об этом."
      - id: trim_subtitles
        hidden_if: {trim_media_kind: "audio"}
        type: "checkbox"
        group: "metadata"
        label: "Subtitles"
        label_ru: "Субтитры"
        default: true
        tooltip: "Carries subtitle streams over. Camera files rarely have them, but a DJI writes its flight data as subtitles, and dropping them loses the flight log. The lines are rebuilt for the cut rather than copied: each is trimmed to the piece kept and moved onto its timeline, so a line across IN or OUT keeps its part inside, and after Cut it out the lines sit where the join puts them. MP4 and MOV write them as mov_text, MKV as SRT; picture subtitles stay behind, and the log says so."
        tooltip_ru: "Переносит субтитры. У камерных файлов они редки, но DJI пишет субтитрами данные полёта — выбросить их значит потерять журнал полёта. Реплики не копируются, а собираются заново: каждая обрезается по сохраняемому куску и сдвигается на его шкалу времени, так что реплика через IN или OUT сохраняет свою часть внутри, а после «Вырезать» реплики стоят там, куда их ставит склейка. MP4 и MOV пишут их как mov_text, MKV — как SRT; субтитры картинкой остаются, и журнал это скажет."
      - id: trim_timecode
        tooltip: "The timecode of the piece: shifted by what was cut away - the edit syncs cameras by it - or from zero."
        tooltip_ru: "Таймкод куска: со сдвигом на отрезанное - по нему монтаж синхронизирует камеры - или от нуля."
        hidden_if: {trim_media_kind: "audio"}
        type: "radio"
        choice_style: "buttons"
        layout: "two_columns"
        group: "metadata"
        span: "full"
        label: "Timecode"
        label_ru: "Таймкод"
        default: "shift"
        options:
          - {value: "shift", label: "Shift", label_ru: "Сдвинуть", tone: "copy", tooltip: "The new start is the old timecode plus the piece that was cut away. This is what the edit syncs cameras by.", tooltip_ru: "Начало нового файла — старый TC плюс отрезанное. Именно по нему на монтаже синхронизируют камеры."}
          - {value: "zero", label: "Zero", label_ru: "Обнулить", tooltip: "Start at 00:00:00:00, for a file that leaves as a standalone piece.", tooltip_ru: "Начать с 00:00:00:00 — для файла, который уходит наружу сам по себе."}
      - id: trim_faststart
        hidden_if: {trim_media_kind: "audio"}
        type: "checkbox"
        group: "metadata"
        label: "faststart"
        label_ru: "faststart"
        tooltip: "Move the header to the front so an MP4 or MOV starts playing before it is fully downloaded."
        tooltip_ru: "Перенести заголовок в начало, чтобы MP4 или MOV начинал играть, не скачавшись целиком."
        default: true
      - <<: *overwrite
        group: "run"
      - <<: *limit_first_file
        group: "run"
      - <<: *dry_run
        group: "run"
    children:
      - id: trim_run
        title: "Trim the file"
        title_ru: "Обрезать файл"
        description: "Cut on the nearest keyframe, copy the streams, shift the timecode; sound on the sample."
        description_ru: "Резать по ближайшему ключевому кадру, копировать потоки, сдвинуть таймкод; звук — по сэмплу."
        service: "system_core.services.media_service:trim_media"
        kind: "safe"

  - id: fps
    title: "FPS / cadence"
    title_ru: "FPS / частота"
    description: "Read the source FPS from each video stream, then choose conversion mode and target."
    description_ru: "Исходный FPS берётся из видеопотока; выбираются режим и целевая частота."
    fields:
      - *input_video_formats
      - id: fps_mode
        tooltip: "Varispeed plays every frame faster or slower and the sound with it: the pitch moves with the speed. Conform keeps the pitch and stretches the sound. Up to 1 % of change both keep the samples of the sound."
        tooltip_ru: "Varispeed проигрывает каждый кадр быстрее или медленнее и звук вместе с ним: тон идёт за скоростью. Conform держит тон и растягивает звук. До 1 % изменения скорости оба режима сохраняют сэмплы звука."
        type: "radio"
        choice_style: "buttons"
        layout: "two_columns"
        group: "fps"
        label: "Conversion mode"
        label_ru: "Режим пересчёта"
        default: "varispeed"
        options:
          - {value: "varispeed", label: "Varispeed", label_ru: "Varispeed"}
          - {value: "conform", label: "Conform", label_ru: "Conform"}
      - id: fps_target
        tooltip: "The frame rate the file is played at. Every frame stays: the duration changes, not the picture."
        tooltip_ru: "Частота, с которой файл будет проигрываться. Все кадры остаются: меняется длительность, а не картинка."
        type: "radio"
        choice_style: "buttons"
        layout: "four_columns"
        group: "fps"
        label: "Target FPS"
        label_ru: "Целевая частота"
        default: "24000/1001"
        options:
          - {value: "16", label: "16", label_ru: "16", tooltip: "Silent-era cinema. Material shot at 16 and shown at 24 is where the hurried walk of old newsreels comes from.", tooltip_ru: "Немое кино. Снятое на 16 и показанное на 24 — та самая суетливая походка старой хроники."}
          - {value: "18", label: "18", label_ru: "18", tooltip: "Amateur 8 mm and late silent film.", tooltip_ru: "Любительские 8 мм и позднее немое кино."}
          - {value: "24000/1001", label: "23.976", label_ru: "23.976", tooltip: "Cinema and streaming default: 24 pulled down by 1000/1001 for NTSC.", tooltip_ru: "Умолчание кино и стриминга: 24, притянутые на 1000/1001 под NTSC."}
          - {value: "24", label: "24", label_ru: "24", tooltip: "True 24.000 — film projection and digital cinema.", tooltip_ru: "Честные 24,000 — киноплёнка и цифровой кинотеатр."}
          - {value: "25", label: "25", label_ru: "25", tooltip: "PAL: television and broadcast across Europe.", tooltip_ru: "PAL: телевидение и вещание в Европе."}
          - {value: "30000/1001", label: "29.97", label_ru: "29.97", tooltip: "NTSC standard definition.", tooltip_ru: "Стандарт NTSC."}
          - {value: "30", label: "30", label_ru: "30", tooltip: "True 30.000 — web video and screen capture.", tooltip_ru: "Честные 30,000 — веб-видео и запись экрана."}
          - {value: "48", label: "48", label_ru: "48", tooltip: "High frame rate cinema — twice 24.", tooltip_ru: "Кино с высокой частотой — вдвое от 24."}
          - {value: "50", label: "50", label_ru: "50", tooltip: "PAL broadcast at double rate — sport and live.", tooltip_ru: "Вещание PAL с удвоенной частотой — спорт и прямой эфир."}
          - {value: "60000/1001", label: "59.94", label_ru: "59.94", tooltip: "NTSC high definition.", tooltip_ru: "NTSC высокой чёткости."}
          - {value: "60", label: "60", label_ru: "60", tooltip: "True 60.000 — web video and screen capture.", tooltip_ru: "Честные 60,000 — веб-видео и запись экрана."}
      - id: fps_output_profile
        tooltip: "The codec and the container of the result: H.264 or HEVC in MP4 with AAC, ProRes or DNxHR in MOV or MXF with PCM."
        tooltip_ru: "Кодек и контейнер результата: H.264 или HEVC в MP4 с AAC, ProRes или DNxHR в MOV или MXF с PCM."
        type: "profile_buttons"
        group: "fps"
        span: "full"
        label: "Output profile"
        label_ru: "Профиль вывода"
        default: "h264"
        presets:
          - id: "h264"
            label: "H.264 MP4"
            label_ru: "H.264 MP4"
            group: "delivery"
            group_label: "Delivery"
            group_label_ru: "Delivery"
            tone: "lossy"
            description: "MP4 with H.264 and AAC. The bitrate of the sound is chosen below."
            description_ru: "MP4 с H.264 и AAC. Битрейт аудио выбирается ниже."
            values: {fps_output_profile: "h264", encode_backend: "cpu", audio_bitrate: "384k", fps_audio_pcm_depth: "s24", fps_audio_oversample: "x1", crf: 14, cq: 19, cpu_encoder_preset: "medium"}
          - id: "hevc"
            label: "H.265 MP4"
            label_ru: "H.265 MP4"
            group: "delivery"
            group_label: "Delivery"
            group_label_ru: "Delivery"
            tone: "lossy"
            description: "MP4 with H.265/HEVC and AAC. The bitrate of the sound is chosen below."
            description_ru: "MP4 с H.265/HEVC и AAC. Битрейт аудио выбирается ниже."
            values: {fps_output_profile: "hevc", encode_backend: "cpu", audio_bitrate: "384k", fps_audio_pcm_depth: "s24", fps_audio_oversample: "x1", crf: 16, cq: 19, cpu_encoder_preset: "medium"}
          - id: "prores"
            label: "ProRes MOV"
            label_ru: "ProRes MOV"
            group: "mezzanine"
            group_label: "Mezzanine"
            group_label_ru: "Монтаж"
            tone: "lossless"
            description: "ProRes 422 in Apple MOV with 16/24/32-float PCM; the selected internal rate can remain 96/192 kHz."
            description_ru: "ProRes 422 в Apple MOV с PCM 16/24/32-float; выбранные 96/192 кГц сохраняются на выходе."
            values: {fps_output_profile: "prores", fps_audio_pcm_depth: "s24", fps_audio_oversample: "x2"}
          - id: "prores_mxf"
            label: "ProRes MXF"
            label_ru: "ProRes MXF"
            group: "mezzanine"
            group_label: "Mezzanine"
            group_label_ru: "Монтаж"
            tone: "lossless"
            description: "ProRes 422 in MXF with 16/24-bit PCM at the FFmpeg MXF output rate of 48 kHz."
            description_ru: "ProRes 422 в MXF с PCM 16/24-bit; финальная частота MXF в FFmpeg — 48 кГц."
            values: {fps_output_profile: "prores_mxf", fps_audio_pcm_depth: "s24", fps_audio_oversample: "x2"}
          - id: "dnxhr"
            label: "DNxHR MOV"
            label_ru: "DNxHR MOV"
            group: "mezzanine"
            group_label: "Mezzanine"
            group_label_ru: "Монтаж"
            tone: "lossless"
            description: "DNxHR HQX in Apple MOV with 16/24/32-float PCM; the selected internal rate can remain 96/192 kHz."
            description_ru: "DNxHR HQX в Apple MOV с PCM 16/24/32-float; выбранные 96/192 кГц сохраняются на выходе."
            values: {fps_output_profile: "dnxhr", fps_audio_pcm_depth: "s24", fps_audio_oversample: "x2"}
          - id: "dnxhr_mxf"
            label: "DNxHR MXF"
            label_ru: "DNxHR MXF"
            group: "mezzanine"
            group_label: "Mezzanine"
            group_label_ru: "Монтаж"
            tone: "lossless"
            description: "DNxHR HQX in MXF with 16/24-bit PCM at the FFmpeg MXF output rate of 48 kHz."
            description_ru: "DNxHR HQX в MXF с PCM 16/24-bit; финальная частота MXF в FFmpeg — 48 кГц."
            values: {fps_output_profile: "dnxhr_mxf", fps_audio_pcm_depth: "s24", fps_audio_oversample: "x2"}
      - <<: *audio_bitrate
        group: "audio"
        visible_if: {fps_output_profile: ["h264", "hevc"]}
      - <<: *encode_backend
        visible_if: {fps_output_profile: ["h264", "hevc"]}
      - *decode_backend
      - <<: *cpu_encoder_preset
        visible_if: {fps_output_profile: ["h264", "hevc"]}
      - <<: *nvenc_preset
        visible_if: {fps_output_profile: ["h264", "hevc"], encode_backend: "cuda"}
      - <<: *qsv_encoder_preset
        visible_if: {fps_output_profile: ["h264", "hevc"], encode_backend: "qsv"}
      - <<: *amf_quality
        visible_if: {fps_output_profile: ["h264", "hevc"], encode_backend: "amd"}
      - <<: *crf
        visible_if: {fps_output_profile: ["h264", "hevc"]}
      - <<: *cq
        visible_if: {fps_output_profile: ["h264", "hevc"], encode_backend: ["cuda", "qsv", "amd"]}
      - id: fps_audio_pcm_depth
        tooltip: "The bit depth of the PCM sound of ProRes and DNxHR. MXF takes 16 or 24 bits."
        tooltip_ru: "Разрядность звука PCM у ProRes и DNxHR. MXF берёт 16 или 24 бита."
        type: "radio"
        group: "audio"
        choice_style: "buttons"
        layout: "three_columns"
        visible_if: {fps_output_profile: ["prores", "prores_mxf", "dnxhr", "dnxhr_mxf"]}
        label: "PCM depth"
        label_ru: "Разрядность PCM"
        default: "s24"
        options:
          - {value: "s16", label: "PCM 16-bit", label_ru: "PCM 16-bit"}
          - {value: "s24", label: "PCM 24-bit", label_ru: "PCM 24-bit"}
          - value: "f32"
            label: "PCM 32-float"
            label_ru: "PCM 32-float"
            enabled_if: {fps_output_profile: ["prores", "dnxhr"]}
            tooltip: "32-bit float PCM is available for MOV mezzanine output. MXF uses PCM 24-bit because FFmpeg does not mux pcm_f32le into MXF."
            tooltip_ru: "32-bit float PCM доступен для MOV. Для MXF используется PCM 24-bit: FFmpeg не mux-ит pcm_f32le в MXF."
      - id: fps_audio_oversample
        type: "radio"
        group: "audio"
        choice_style: "buttons"
        layout: "three_columns"
        visible_if: {fps_output_profile: ["prores", "prores_mxf", "dnxhr", "dnxhr_mxf"]}
        label: "Audio oversampling"
        label_ru: "Oversampling аудио"
        hint: "Internal processing rate. MXF output is finalized at 48 kHz by the FFmpeg MXF muxer."
        hint_ru: "Частота внутренней обработки. Финальный звук MXF сводится muxer-ом FFmpeg к 48 кГц."
        default: "x2"
        options:
          - {value: "x1", label: "COPY", label_ru: "COPY"}
          - {value: "x2", label: "2x 88.2/96", label_ru: "2x 88.2/96"}
          - {value: "x4", label: "4x 176.4/192", label_ru: "4x 176.4/192"}
      - *overwrite
      - *dry_run
    children:
      - id: fps_run
        title: "Convert FPS"
        title_ru: "Пересчитать FPS"
        description: "Probe source FPS and render the selected target cadence."
        description_ru: "Прочитать FPS исходника и вывести выбранную частоту."
        service: "system_core.services.media_service:fps_convert"
        kind: "safe"

  - id: grading
    title: "Color / LUT"
    title_ru: "Цвет / LUT"
    description: "Original LUT and HDR-to-SDR script presets."
    description_ru: "Исходные пресеты LUT и HDR-to-SDR."
    fields:
      - id: lut_file
        type: "lut_select"
        label: "LUT"
        label_ru: "LUT"
        hint: "Defaults to LUTs\\active.cube or the first LUT file in LUTs."
        hint_ru: "По умолчанию LUTs\\active.cube или первый LUT-файл из папки LUTs."
      - *input_video_formats
      - id: grading_profile
        tooltip: "The primary mode for the entire Color/LUT window. It selects the transform and production defaults; fields below remain explicit overrides."
        tooltip_ru: "Главный режим всего окна Color/LUT. Кнопка выбирает преобразование и рабочие defaults; поля ниже остаются явными overrides."
        type: "profile_buttons"
        group: "color"
        label: "Color preset"
        label_ru: "Цветовой пресет"
        default: "lut_x264"
        presets:
          - {id: "lut_x264", label: "LUT x264", label_ru: "LUT x264", tone: "lossy", description: "Apply the selected LUT without pre-gamma and encode an H.264 MP4 production default.", description_ru: "Применить выбранный LUT без pre-gamma и вывести рабочий H.264 MP4.", values: {script_preset: "ff-grade-lut-only-x264.cmd", output_container: "mp4", pix_fmt: "yuv420p", encode_backend: "cpu", decode_backend: "auto", crf: 14, cq: 14}}
          - {id: "lut_hevc10", label: "LUT HEVC Main10", label_ru: "LUT HEVC Main10", tone: "lossy", description: "Apply the selected LUT without pre-gamma and encode 10-bit HEVC Main10.", description_ru: "Применить выбранный LUT без pre-gamma и вывести 10-bit HEVC Main10.", values: {script_preset: "ff-grade-lut-only-hevc10.cmd", output_container: "mp4", pix_fmt: "yuv420p10le", encode_backend: "cpu", decode_backend: "auto", crf: 14, cq: 14}}
          - {id: "lut_prores422", label: "LUT ProRes 422", label_ru: "LUT ProRes 422", tone: "lossless", description: "Apply the selected LUT and create a 10-bit 4:2:2 ProRes editing intermediate.", description_ru: "Применить выбранный LUT и создать монтажный 10-bit 4:2:2 ProRes intermediate.", values: {script_preset: "ff-grade-lut-only-prores422.cmd", output_container: "mov", pix_fmt: "yuv422p10le", encode_backend: "cpu", decode_backend: "auto"}}
          - {id: "preexpose_x264", label: "Pre-expose LUT x264", label_ru: "Pre-expose LUT x264", tone: "lossy", description: "Apply gamma 1.15 before the LUT, lifting 18% gray to about 22.5%, then encode x264.", description_ru: "До LUT применить Gamma 1.15: поднять 18% серый примерно до 22.5%, затем кодировать x264.", values: {script_preset: "ff-grade-preexpose-lut-x264.cmd", pre_gamma: 1.15, output_container: "mp4", pix_fmt: "yuv420p", encode_backend: "cpu", decode_backend: "auto", crf: 14, cq: 14}}
          - {id: "pregamma_hevc10", label: "Pregamma HEVC Main10", label_ru: "Pregamma HEVC Main10", tone: "lossy", description: "Apply gamma 0.85 before the LUT, lowering 18% gray to about 13.3%, then encode HEVC Main10.", description_ru: "До LUT применить Gamma 0.85: опустить 18% серый примерно до 13.3%, затем кодировать HEVC Main10.", values: {script_preset: "ff-grade-pregamma-lut-hevc10.cmd", pre_gamma: 0.85, output_container: "mp4", pix_fmt: "yuv420p10le", encode_backend: "cpu", decode_backend: "auto", crf: 14, cq: 14}}
          - {id: "hdr_hable_x264", label: "HDR to SDR x264", label_ru: "HDR to SDR x264", tone: "lossy", description: "Convert BT.2020/PQ HDR to BT.709 SDR with Hable tonemapping and encode x264.", description_ru: "Преобразовать BT.2020/PQ HDR в BT.709 SDR через Hable tonemapping и кодировать x264.", values: {script_preset: "ff-hdr2sdr-hable-x264.cmd", output_container: "mp4", pix_fmt: "yuv420p", encode_backend: "cpu", decode_backend: "auto", crf: 14, cq: 14}}
      - id: script_preset
        type: "select"
        group: "color"
        hidden: true
        label: "Color operation"
        label_ru: "Цветовая операция"
        default: "ff-grade-lut-only-x264.cmd"
        refresh_on_change: true
        options:
          - {value: "ff-grade-lut-only-x264.cmd", label: "LUT only", label_ru: "Только LUT"}
          - {value: "ff-grade-lut-only-hevc10.cmd", label: "LUT only HEVC Main10", label_ru: "Только LUT HEVC Main10"}
          - {value: "ff-grade-lut-only-prores422.cmd", label: "LUT only ProRes 422", label_ru: "Только LUT ProRes 422"}
          - {value: "ff-grade-preexpose-lut-x264.cmd", label: "Pre-expose + LUT", label_ru: "Предэкспозиция + LUT"}
          - {value: "ff-grade-pregamma-lut-x264.cmd", label: "Pregamma + LUT", label_ru: "Pregamma + LUT"}
          - {value: "ff-grade-pregamma-lut-hevc10.cmd", label: "Pregamma + LUT HEVC Main10", label_ru: "Pregamma + LUT HEVC Main10"}
          - {value: "ff-grade-pregamma-lut-prores422.cmd", label: "Pregamma + LUT ProRes 422", label_ru: "Pregamma + LUT ProRes 422"}
          - {value: "ff-hdr2sdr-hable-x264.cmd", label: "HDR to SDR Hable", label_ru: "HDR to SDR Hable"}
      - id: pre_gamma
        tooltip: "Gamma applied before the LUT. Values above 1 lift 18% gray; values below 1 lower it. The preview is a pre-LUT technical reference."
        tooltip_ru: "Gamma применяется до LUT. Значения выше 1 поднимают 18% серый, ниже 1 — опускают. Preview показывает технический ориентир до LUT."
        type: "float"
        group: "color"
        label: "Pre-LUT gamma"
        label_ru: "Gamma до LUT"
        default: ""
        min: 0.1
        max: 5.0
        step: 0.01
        refresh_on_change: true
        visible_if:
          script_preset: ["ff-grade-preexpose-lut-x264.cmd", "ff-grade-pregamma-lut-x264.cmd", "ff-grade-pregamma-lut-hevc10.cmd", "ff-grade-pregamma-lut-prores422.cmd"]
      - id: target_codecs
        tooltip: "One or more output targets. Multiple targets are written separately for each Source file."
        tooltip_ru: "Один или несколько выходных таргетов. Каждый таргет пишется отдельно для каждого файла Источника."
        type: "checkboxes"
        label: "Color output targets"
        label_ru: "Цели цветового вывода"
        default: []
        options:
          - {value: "x264", label: "x264 / H.264", label_ru: "x264 / H.264"}
          - {value: "hevc_x265", label: "x265 / HEVC", label_ru: "x265 / HEVC"}
          - {value: "svt_av1", label: "AV1", label_ru: "AV1", tooltip: "AV1 output. CPU encodes it with SVT-AV1; NVENC, QSV and AMF encode it with av1_nvenc, av1_qsv or av1_amf.", tooltip_ru: "Вывод AV1. На CPU кодируется через SVT-AV1; NVENC, QSV и AMF используют av1_nvenc, av1_qsv или av1_amf."}
          - {value: "prores_422", label: "ProRes 422", label_ru: "ProRes 422"}
          - {value: "prores_lt", label: "ProRes LT", label_ru: "ProRes LT"}
      - *encode_backend
      - *decode_backend
      - *mxf_safe_audio_mode
      - *audio_sample_rate
      - *mp3_lame_preset_encode
      - *audio_bitrate
      - *output_container
      - *cpu_encoder_preset
      - *nvenc_preset
      - *qsv_encoder_preset
      - *amf_quality
      - *output_resolution
      - *scan_mode
      - *av1_preset
      - *pix_fmt
      - *crf
      - *cq
      - *overwrite
      - *limit_first_file
      - *dry_run
    children:
      - id: grading_run
        title: "Run color"
        title_ru: "Запустить цвет"
        description: "Apply selected color operation with the current overrides."
        description_ru: "Применить выбранную цветовую операцию с текущими overrides."
        service: "system_core.services.media_service:run_color_grade"
        kind: "safe"

  - id: diagnostics
    title: "Diagnostics"
    title_ru: "Диагностика"
    description: "Project and tool checks."
    description_ru: "Проверки проекта и portable-инструментов."
    children:
      - id: inventory
        title: "Inventory"
        title_ru: "Инвентаризация"
        description: "Count project folders."
        description_ru: "Посчитать файлы в Источнике, Назначении и LUTs."
        service: "system_core.services.media_service:inventory"
        kind: "safe"
      - id: selftest
        title: "Selftest"
        title_ru: "Самопроверка"
        description: "Check ffmpeg, ffprobe, yt-dlp and Deno."
        description_ru: "Проверить ffmpeg, ffprobe, yt-dlp и Deno."
        service: "system_core.services.media_service:selftest"
        kind: "safe"
      - id: profile_doctor
        title: "Profile Doctor"
        title_ru: "Проверка профилей"
        description: "Validate GUI operations, script wrappers and the shared preset catalog."
        description_ru: "Проверить операции GUI, script wrappers и общий каталог пресетов."
        service: "system_core.services.media_service:profile_doctor"
        kind: "safe"
      - id: hardware_capabilities
        title: "Hardware capabilities"
        title_ru: "Возможности оборудования"
        description: "Run short FFmpeg smoke tests for CPU, QSV/NVENC/AMF H.264 and HEVC, SVT-AV1 and dav1d."
        description_ru: "Короткий FFmpeg smoke для CPU, QSV/NVENC/AMF H.264 и HEVC, SVT-AV1 и dav1d."
        service: "system_core.services.media_service:hardware_capabilities"
        kind: "safe"
      - id: preset_test_matrix
        title: "Preset Test Matrix"
        title_ru: "Тест матрицы пресетов"
        description: "Run portable 1-second smoke tests across audio, remux, FPS, LUT, archive, editing, storage and delivery presets."
        description_ru: "Прогнать portable smoke на 1-секундных файлах по audio, remux, FPS, LUT, архиву, монтажу, хранению и публикации."
        service: "system_core.services.media_service:preset_test_matrix"
        kind: "safe"

  - id: install_tools
    title: "Install tools"
    title_ru: "Установка инструментов"
    description: "Explicit installers for external tool payloads."
    description_ru: "Явная установка внешних tool payloads."
    children:
      - id: install_7zip
        title: "Install 7-Zip"
        title_ru: "Установить 7-Zip"
        description: "Install or refresh portable 7-Zip; required before FFmpeg 7z payloads."
        description_ru: "Установить или обновить portable 7-Zip; нужен для FFmpeg 7z payloads."
        service: "system_core.services.media_service:install_portable_7zip"
        kind: "safe"
      - id: install_ffmpeg
        title: "Install FFmpeg"
        title_ru: "Установить FFmpeg"
        description: "Install or refresh the portable FFmpeg of Gyan (GPL) in Tools\\ffmpeg by the NVIDIA driver: the newest stable, 9.0.2 at least, without an NVIDIA card and from the LTS driver 610.88; below it 8.0.1 (570-610.87) or 7.1 so that NVENC works, and not every operation is possible."
        description_ru: "Установить или обновить переносную FFmpeg от Gyan (GPL) в Tools\\ffmpeg по драйверу NVIDIA: самая новая стабильная, не ниже 9.0.2, без карты NVIDIA и с LTS-драйвером 610.88 и новее; ниже него 8.0.1 (570-610.87) или 7.1, чтобы работал NVENC, и доступны не все операции."
        service: "system_core.services.media_service:install_portable_ffmpeg"
        kind: "safe"
      - id: install_ytdlp
        title: "Install yt-dlp"
        title_ru: "Установить yt-dlp"
        description: "Install or refresh portable yt-dlp and Deno into Tools."
        description_ru: "Установить или обновить portable yt-dlp и Deno в Tools."
        service: "system_core.services.media_service:install_portable_ytdlp"
        kind: "safe"
      - id: install_mpv
        title: "Install mpv"
        title_ru: "Установить mpv"
        description: "Install or refresh portable mpv into Tools/mpv: the player of the trim."
        description_ru: "Установить или обновить portable mpv в Tools/mpv: плеер нарезки."
        service: "system_core.services.media_service:install_portable_mpv"
        kind: "safe"
      - id: install_cineraw
        title: "Install ProRes RAW development"
        title_ru: "Установить проявку ProRes RAW"
        description: "Build cineraw of libcraw into Tools/cineraw from its sources: a portable MSYS2 for the build (about 185 MB downloaded, 5 minutes), removed afterwards; cineraw develops ProRes RAW on a video card with Vulkan 1.4 (NVIDIA RTX)."
        description_ru: "Собрать cineraw из libcraw в Tools/cineraw из исходников: переносной MSYS2 для сборки (около 185 МБ загрузки, 5 минут), удаляется после; cineraw проявляет ProRes RAW на видеокарте с Vulkan 1.4 (NVIDIA RTX)."
        service: "system_core.services.media_service:install_cineraw"
        kind: "safe"

maintenance_operations:
  - id: probe_source
    title: "Probe Source"
    title_ru: "Проверить источник"
    description: "Run ffprobe once for Source, print a compact table and update the media status line."
    description_ru: "Один раз запустить ffprobe по Источнику, вывести таблицу и обновить строку параметров."
    service: "system_core.services.media_service:probe_source"
    kind: "safe"
    parameters:
      sample_limit: 50

  - id: source_info
    title: "Source Info"
    title_ru: "Инфо об источниках"
    description: "Run ffprobe for Source and print every audio stream: codec, sample format, sample rate, bit depth, channels, bitrate and tags."
    description_ru: "Прогнать ffprobe по Источнику и вывести все аудиопотоки: codec, sample_fmt, sample rate, bits, channels, bitrate, language/title."
    service: "system_core.services.media_service:source_info"
    kind: "safe"
    parameters:
      sample_limit: 0

  - id: cleanup_source
    title: "Clear Source"
    title_ru: "Очистить Источник"
    description: "Delete files from the selected Source folder, including an external selected Source after confirmation."
    description_ru: "Удалить файлы из выбранного Источника, включая внешнюю папку или файл после подтверждения."
    service: "system_core.services.media_service:cleanup_source"
    kind: "dangerous"

  - id: cleanup_transcoded
    title: "Clear Target"
    title_ru: "Очистить Назначение"
    description: "Delete files from the selected destination/output folder, including an external selected folder after confirmation."
    description_ru: "Удалить файлы из выбранного Назначения, включая внешнюю папку после подтверждения."
    service: "system_core.services.media_service:cleanup_transcoded"
    kind: "dangerous"

  - id: cleanup_workspace
    title: "Clear GUI workspace"
    title_ru: "Очистить GUI workspace"
    description: "Delete managed workspace and report folders."
    description_ru: "Очистить управляемые папки workspace и report."
    service: "system_core.services.media_service:cleanup_workspace"
    kind: "dangerous"
