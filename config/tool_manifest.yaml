    service: "system_core.services.media_service:source_info"
    kind: "safe"
    parameters:
      sample_limit: 0

  - id: cleanup_source
    title: "Clear Source"
    title_ru: "Очистить Source"
    description: "Delete files from the selected Source folder, including an external selected Source after confirmation."
