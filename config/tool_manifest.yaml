          - {id: "prores_hq_mxf", label: "HQ", label_ru: "HQ", group: "prores_mxf", group_label: "ProRes · MXF", group_label_ru: "ProRes · MXF", tone: "lossless", description: "ProRes 422 HQ in MXF with PCM 24-bit.", description_ru: "ProRes 422 HQ в MXF с PCM 24-bit.", values: {target_codecs: ["prores_hq"], output_container: "mxf", audio_mode: "pcm_s24", pix_fmt: "yuv422p10le"}}
