        label_ru: "Контейнер Copy"
        default: "auto"
        options:
          - value: "auto"
            label: "Auto"
            label_ru: "Auto"
            tooltip: "Pick a practical container from codec and channels: stereo AAC becomes M4A; AC3/E-AC3/DTS become native codec files; unsupported or multichannel AAC falls back to MKA."
            tooltip_ru: "Подобрать контейнер по кодеку и каналам: stereo AAC станет M4A; AC3/E-AC3/DTS станут родными файлами кодека; неподдержанное или многоканальное AAC уйдёт в MKA."
          - value: "m4a"
            label: "M4A"
            label_ru: "M4A"
            tooltip: "Force M4A when the copied codec is compatible with M4A, otherwise fall back to MKA."
            tooltip_ru: "Принудительно M4A для совместимых потоков, иначе fallback в MKA."
          - value: "mka"
            label: "MKA"
            label_ru: "MKA"
            tooltip: "Force Matroska audio for every copied stream."
            tooltip_ru: "Принудительно Matroska Audio для каждого копируемого потока."
