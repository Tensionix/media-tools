            label: "Codec file"
            label_ru: "Файл кодека"
            tooltip: "Write native codec files when possible, for example AAC, AC3, E-AC3, DTS, FLAC or MP3."
            tooltip_ru: "Писать родные файлы кодека, где возможно: AAC, AC3, E-AC3, DTS, FLAC или MP3."
