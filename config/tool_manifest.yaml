        label_ru: "Выровнять метки времени"
        tooltip: "Fills the gaps of the sound and trims its overlaps by the timestamps, from zero (aresample=async=1:first_pts=0): a recording with broken timestamps keeps in step with its picture."
        tooltip_ru: "Заполняет пропуски звука и срезает наложения по меткам времени, от нуля (aresample=async=1:first_pts=0): запись с битыми метками не расходится с картинкой."
        default: false
      - id: audio_video_container
        tooltip: "Container for video-copy mode. Some audio codecs are disabled for unsafe container pairs."
        tooltip_ru: "Контейнер для режима обновления звука в видео. Небезопасные пары кодек/контейнер отключаются."
        type: "radio"
        choice_style: "buttons"
        group: "format"
        layout: "three_columns"
        visible_if: {audio_workflow: "in_video"}
        label: "Video container"
        label_ru: "Контейнер видео"
        default: "source"
        options:
          - {value: "source", label: "Source", label_ru: "Исходный"}
          - {value: "mov", label: "MOV", label_ru: "MOV", disabled_if: {audio_format: ["flac", "opus"]}}
          - {value: "mkv", label: "MKV", label_ru: "MKV"}
          - {value: "mp4", label: "MP4", label_ru: "MP4", disabled_if: {audio_format: ["wav", "flac"]}}
          - {value: "mxf", label: "MXF", label_ru: "MXF", disabled_if: {audio_format: ["flac", "alac", "m4a", "mp3", "opus"]}}
      - <<: *audio_bitrate
        group: "format"
        visible_if:
          any:
            - {audio_format: ["m4a", "opus"]}
            - {all: [{audio_format: "mp3"}, {mp3_lame_preset: "bitrate"}]}
      - id: audio_stream_mode
        tooltip: "Which audio stream(s) to process from each source file."
        tooltip_ru: "Какие аудиопотоки брать из каждого исходного файла."
        type: "radio"
        choice_style: "buttons"
        group: "streams"
        layout: "four_columns"
        span: "full"
        refresh_on_change: true
        label: "Audio streams"
        label_ru: "Аудиопотоки"
        default: "first"
        options:
          - {value: "first", label: "First stream", label_ru: "Первый поток"}
          - {value: "all", label: "All streams", label_ru: "Все потоки"}
          - {value: "index", label: "By index", label_ru: "По индексу"}
          - {value: "language", label: "By language", label_ru: "По языку"}
      - id: audio_stream_index
        tooltip: "Zero-based audio stream index: a0 is the first audio stream."
        tooltip_ru: "Индекс аудиопотока с нуля: a0 означает первый аудиопоток."
        type: "number"
        group: "streams"
        visible_if: {audio_stream_mode: "index"}
        label: "Stream index"
        label_ru: "Индекс потока"
        default: 0
        min: 0
        max: 32
        step: 1
      - id: audio_language
        tooltip: "Match streams by container language tag such as eng, rus or ukr."
        tooltip_ru: "Выбор дорожек по языковому тегу контейнера, например eng, rus или ukr."
        type: "select"
        group: "streams"
        visible_if: {audio_stream_mode: "language"}
        label: "Language tag"
        label_ru: "Язык"
        default: ""
        options:
          - {value: "", label: "Not selected", label_ru: "Не выбран"}
          - {value: "eng", label: "English (eng)", label_ru: "Английский (eng)"}
          - {value: "ara", label: "Arabic (ara)", label_ru: "Арабский (ara)"}
          - {value: "spa", label: "Spanish (spa)", label_ru: "Испанский (spa)"}
          - {value: "ita", label: "Italian (ita)", label_ru: "Итальянский (ita)"}
          - {value: "zho", label: "Chinese (zho)", label_ru: "Китайский (zho)"}
          - {value: "kor", label: "Korean (kor)", label_ru: "Корейский (kor)"}
          - {value: "deu", label: "German (deu)", label_ru: "Немецкий (deu)"}
          - {value: "pol", label: "Polish (pol)", label_ru: "Польский (pol)"}
          - {value: "por", label: "Portuguese (por)", label_ru: "Португальский (por)"}
          - {value: "rus", label: "Russian (rus)", label_ru: "Русский (rus)"}
          - {value: "ukr", label: "Ukrainian (ukr)", label_ru: "Украинский (ukr)"}
          - {value: "fra", label: "French (fra)", label_ru: "Французский (fra)"}
          - {value: "jpn", label: "Japanese (jpn)", label_ru: "Японский (jpn)"}
      - id: audio_lufs
        tooltip: "Target integrated loudness for loudnorm."
        tooltip_ru: "Целевая интегральная громкость для loudnorm."
        type: "radio"
        choice_style: "buttons"
        layout: "four_columns"
        # Full width of the half section: four captions such as "Two passes"
        # do not fit into half of a half.
        span: "full"
        group: "mastering"
        visible_if:
          all:
            - audio_lufs_mode: ["report", "one_pass", "two_pass"]
            - not: {audio_format: "copy"}
        label: "LUFS"
        label_ru: "LUFS"
        default: "off"
        options:
          - {value: "off", label: "Off", label_ru: "Выкл."}
          - {value: "-14", label: "-14", label_ru: "-14"}
          - {value: "-16", label: "-16", label_ru: "-16"}
          - {value: "-23", label: "-23", label_ru: "-23"}
      - id: audio_lufs_mode
        tooltip: "Report analyzes loudness only; one-pass is quick; two-pass is more accurate."
        tooltip_ru: "Отчёт только измеряет громкость; один проход быстрее; два прохода точнее."
        type: "radio"
        choice_style: "buttons"
        layout: "four_columns"
        # Full width of the half section: four captions such as "Two passes"
        # do not fit into half of a half.
        span: "full"
        group: "mastering"
        refresh_on_change: true
        hidden_if: {audio_format: "copy"}
        label: "LUFS mode"
        label_ru: "Режим LUFS"
        default: "off"
        options:
          - {value: "off", label: "Off", label_ru: "Выкл."}
          - {value: "report", label: "Report only", label_ru: "Отчёт"}
          - {value: "one_pass", label: "One pass", label_ru: "One pass"}
          - {value: "two_pass", label: "Two pass", label_ru: "Two pass"}
      - id: audio_channel_mode
        tooltip: "Channel layout operation: keep original channels, downmix to stereo/mono, or make dual mono."
        tooltip_ru: "Операция с каналами: сохранить, свести в stereo/mono или сделать dual mono."
        type: "radio"
        choice_style: "buttons"
        group: "channels"
        layout: "four_columns"
        span: "full"
        refresh_on_change: true
        hidden_if: {audio_format: "copy"}
        label: "Channels"
        label_ru: "Каналы"
        default: "keep"
        options:
          - {value: "keep", label: "Keep", label_ru: "Сохранить"}
          - {value: "stereo", label: "Stereo", label_ru: "Stereo"}
          - {value: "mono", label: "Mono", label_ru: "Mono"}
          - {value: "dual_mono", label: "Dual mono", label_ru: "Dual mono"}
      - id: matrix_51
        type: "checkbox"
        group: "channels"
        visible_if:
          all:
            - {audio_channel_mode: "stereo"}
            - not: {audio_format: "copy"}
        label: "5.1 Matrix"
        label_ru: "5.1 Matrix"
        hint: "Adds DPLII-style matrix encoding while downmixing to stereo."
        hint_ru: "Добавляет DPLII matrix-совместимость при сведении в стерео."
        default: false
      - id: downmix_formula
        type: "radio"
        choice_style: "buttons"
        group: "channels"
        layout: "two_columns"
        span: "full"
        visible_if:
          all:
            - {audio_channel_mode: "stereo"}
            - {matrix_51: false}
            - not: {audio_format: "copy"}
        label: "Downmix"
        label_ru: "Сведение"
        tooltip: "How 5.1 becomes stereo. A stereo source stays as it is either way."
        tooltip_ru: "Как 5.1 становится стерео. Стерео-источник в обоих случаях остаётся как есть."
        default: "ffmpeg"
        options:
          - {value: "ffmpeg", label: "FFmpeg", label_ru: "FFmpeg",
             description: "FFmpeg's own (-ac 2): centre and surrounds -3 dB, LFE out, the whole scaled down so it never clips - about 7.6 dB quieter on a full 5.1.",
             description_ru: "Собственное FFmpeg (-ac 2): центр и тылы -3 дБ, LFE не идёт, всё вместе ослаблено, чтобы не было перегрузки, - на полном 5.1 тише примерно на 7,6 дБ."}
          - {value: "surround_6db", label: "Surround -6 dB", label_ru: "Тылы -6 дБ",
             description: "Fronts at full level, centre -3 dB, surrounds -6 dB, LFE out; not scaled down - a loud mix may clip.",
             description_ru: "Фронт в полный уровень, центр -3 дБ, тылы -6 дБ, LFE не идёт; без ослабления - громкий микс может перегрузиться."}
      - <<: *mp3_lame_preset_encode
        group: "format"
        visible_if: {audio_format: "mp3"}
      - *overwrite
      - *limit_first_file
      - *dry_run
    children:
      - id: audio_run
        title: "Run audio"
        title_ru: "Запустить аудио"
        description: "Process audio with the selected preset."
        description_ru: "Обработать аудио выбранным пресетом."
        service: "system_core.services.media_service:audio_process"
        kind: "safe"

  - id: archive
    title: "Archive"
    title_ru: "Архив"
    description: "Long-term master formats: FFV1 and x264 lossless."
    description_ru: "Долговременные мастер-форматы: FFV1 и x264 lossless."
    fields:
      - id: archive_profile
        tooltip: "Lossless archive masters: FFV1 with FLAC in MKV, x264 lossless, or both. The preset fills the form below; any field can be changed afterwards."
        tooltip_ru: "Архивные мастер-копии без потерь: FFV1 с FLAC в MKV, x264 без потерь или обе. Пресет заполняет форму ниже; любое поле можно потом поменять."
        type: "profile_buttons"
        label: "Archive preset"
        label_ru: "Архивный пресет"
        default: "ffv1_mkv"
        presets:
          - id: ffv1_mkv
            label: "FFV1 MKV + FLAC"
            label_ru: "FFV1 MKV + FLAC"
            tone: "lossless"
            description: "Archive master with all streams mapped and FLAC audio; float PCM, which FLAC cannot hold, is copied as it is. A pixel format FFV1 cannot keep is refused."
            description_ru: "Архивный мастер со всеми потоками и FLAC аудио; PCM с плавающей точкой, которого FLAC не держит, копируется как есть. Пиксельный формат, который FFV1 не сохранит, отклоняется."
            values:
              target_codecs: ["ffv1"]
              audio_mode: "flac"
              output_container: "mkv"
              pix_fmt: "auto"
          - id: x264_lossless_mkv
            label: "x264 lossless MKV"
            label_ru: "x264 lossless MKV"
            tone: "lossless"
            description: "CRF 0 x264 archive variant, useful when FFV1 is too heavy. Keeps YUV of 8 and 10 bits; a 12-bit, RGB or alpha source is refused - FFV1 keeps it."
            description_ru: "CRF 0 x264 как архивный вариант, когда FFV1 слишком тяжелый. Держит YUV 8 и 10 бит; источник 12 бит, RGB или с альфой отклоняется — его сохранит FFV1."
            values:
              target_codecs: ["x264_lossless"]
              audio_mode: "source"
              output_container: "mkv"
              pix_fmt: "auto"
          - id: dual_archive
            label: "FFV1 + x264 lossless"
            label_ru: "FFV1 + x264 lossless"
            tone: "lossless"
            description: "Create both archive formats sequentially."
            description_ru: "Последовательно создать оба архивных формата."
            values:
              target_codecs: ["ffv1", "x264_lossless"]
              audio_mode: "flac"
              output_container: "mkv"
              pix_fmt: "auto"
      - *input_video_formats
      - id: target_codecs
        tooltip: "One or more output targets. Multiple targets are written separately for each Source file."
        tooltip_ru: "Один или несколько выходных таргетов. Каждый таргет пишется отдельно для каждого файла Источника."
        type: "checkboxes"
        label: "Archive formats"
        label_ru: "Архивные форматы"
        default: []
        min_selected: 1
        options:
          - {value: "ffv1", label: "FFV1", label_ru: "FFV1"}
          - {value: "x264_lossless", label: "x264 lossless", label_ru: "x264 lossless"}
      - *decode_backend
      - *audio_mode
      - *audio_sample_rate
      - *mp3_lame_preset_encode
      - *audio_bitrate
      - *cpu_encoder_preset
      - *pix_fmt
      - *encode_tuning
      - *overwrite
      - *limit_first_file
      - *dry_run
    children:
      - id: archive_run
        title: "Create archive"
        title_ru: "Создать архив"
        description: "Encode selected archive targets."
        description_ru: "Кодировать выбранные архивные форматы."
        service: "system_core.services.media_service:encode_targets"
        kind: "safe"

