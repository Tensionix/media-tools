  - id: archive
    title: "Archive"
    title_ru: "Архив"
    description: "Long-term master formats: FFV1 and x264 lossless."
    description_ru: "Долговременные мастер-форматы: FFV1 и x264 lossless."
    fields:
      - id: archive_profile
        type: "profile_buttons"
        label: "Archive preset"
        label_ru: "Архивный пресет"
        default: "ffv1_mkv"
        presets:
          - id: ffv1_mkv
            label: "FFV1 MKV + FLAC"
            label_ru: "FFV1 MKV + FLAC"
            tone: "lossless"
            description: "Archive master with all streams mapped and FLAC audio."
            description_ru: "Архивный мастер со всеми потоками и FLAC аудио."
            values:
              target_codecs: ["ffv1"]
              audio_mode: "flac"
              output_container: "mkv"
              pix_fmt: "auto"
          - id: x264_lossless_mkv
            label: "x264 lossless MKV"
            label_ru: "x264 lossless MKV"
            tone: "lossless"
            description: "CRF 0 x264 archive variant, useful when FFV1 is too heavy."
            description_ru: "CRF 0 x264 как архивный вариант, когда FFV1 слишком тяжелый."
            values:
              target_codecs: ["x264_lossless"]
              audio_mode: "source"
              output_container: "mkv"
              pix_fmt: "auto"
          - id: dual_archive
            label: "FFV1 + x264 lossless"
            label_ru: "FFV1 + x264 lossless"
            tone: "lossless"
            description: "Create both archive formats sequentially."
            description_ru: "Последовательно создать оба архивных формата."
            values:
              target_codecs: ["ffv1", "x264_lossless"]
              audio_mode: "flac"
              output_container: "mkv"
              pix_fmt: "auto"
      - *input_video_formats
      - id: target_codecs
        type: "checkboxes"
        label: "Archive formats"
        label_ru: "Архивные форматы"
        default: []
        min_selected: 1
        options:
          - {value: "ffv1", label: "FFV1", label_ru: "FFV1"}
          - {value: "x264_lossless", label: "x264 lossless", label_ru: "x264 lossless"}
      - *decode_backend
      - *audio_mode
      - *audio_sample_rate
      - *mp3_lame_preset_encode
      - *audio_bitrate
      - *cpu_encoder_preset
      - *pix_fmt
      - *encode_tuning
      - *overwrite
      - *limit_first_file
      - *dry_run
    children:
      - id: archive_run
        title: "Create archive"
        title_ru: "Создать архив"
        description: "Encode selected archive targets."
        description_ru: "Кодировать выбранные архивные форматы."
        service: "system_core.services.media_service:encode_targets"
        kind: "safe"

