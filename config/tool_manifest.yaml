tool:
  id: audion_media_tools
  name: "Audion Media Tools"
  category: "Media"
  version: "3.1.0"

paths:
  input: "input"
  output: "output"
  logs: "logs"
  report: "report"
  workspace: "workspace"
  config: "config"

_shared_fields:
  input_video_formats: &input_video_formats
    id: input_formats
    type: "checkboxes"
    label: "Source file filter"
    label_ru: "Фильтр файлов источника"
    hint: "Empty means the operation uses its own supported source file types."
    hint_ru: "Если пусто, команда сама берёт поддерживаемые типы файлов источника."
    default: []
    options:
      - {value: "mp4", label: "MP4", label_ru: "MP4"}
      - {value: "mov", label: "MOV", label_ru: "MOV"}
      - {value: "mkv", label: "MKV", label_ru: "MKV"}
      - {value: "mxf", label: "MXF", label_ru: "MXF"}
      - {value: "avi", label: "AVI", label_ru: "AVI"}
      - {value: "webm", label: "WEBM", label_ru: "WEBM"}
      - {value: "mts", label: "MTS", label_ru: "MTS"}
      - {value: "m2ts", label: "M2TS", label_ru: "M2TS"}

  decode_backend: &decode_backend
    id: decode_backend
    tooltip: "Hardware/software decode preference before encoding."
    tooltip_ru: "Предпочтение аппаратного или программного декодирования перед кодированием."
    type: "radio"
    choice_style: "buttons"
    layout: "five_columns"
    label: "Decoder"
    label_ru: "Декодировать через"
    default: "auto"
    span: "full"
    options:
      - {value: "auto", label: "CPU/Auto", label_ru: "CPU/Auto"}
      - {value: "cuda", label: "CUDA", label_ru: "CUDA"}
      - {value: "qsv", label: "QuickSync", label_ru: "QuickSync"}
      - {value: "amd", label: "AMD/D3D11VA", label_ru: "AMD/D3D11VA"}
      - {value: "dav1d", label: "dav1d AV1", label_ru: "dav1d AV1"}

  encode_backend: &encode_backend
    id: encode_backend
    type: "radio"
    choice_style: "buttons"
    layout: "four_columns"
    label: "Encoder"
    label_ru: "Кодер"
    tooltip: "Select the encoder backend. Each backend exposes its own native preset/quality controls below."
    tooltip_ru: "Выбор backend кодирования. Ниже показываются только родные параметры выбранного backend."
    default: "cpu"
    span: "full"
    refresh_on_change: true
    options:
      - {value: "cpu", label: "CPU", label_ru: "CPU", tooltip: "Software x264/x265. Uses the CPU preset line: fast, medium, slow, slower, veryslow.", tooltip_ru: "Software x264/x265. Использует CPU-линейку preset: fast, medium, slow, slower, veryslow."}
      - {value: "cuda", label: "NVENC", label_ru: "NVENC", tooltip: "NVIDIA hardware encoder. Uses NVENC P-presets p5/p6/p7, not CPU slow/veryslow.", tooltip_ru: "Аппаратный кодер NVIDIA. Использует NVENC P-presets p5/p6/p7, не CPU slow/veryslow."}
      - {value: "amd", label: "AMF", label_ru: "AMF", tooltip: "AMD hardware encoder. Uses AMF quality preset: speed, balanced, quality.", tooltip_ru: "Аппаратный кодер AMD. Использует AMF quality preset: speed, balanced, quality."}
      - {value: "qsv", label: "QSV", label_ru: "QSV", tooltip: "Intel QuickSync encoder. Uses QSV preset values veryfast through veryslow.", tooltip_ru: "Intel QuickSync. Использует QSV preset veryfast...veryslow."}

  encode_tuning: &encode_tuning
    id: encode_tuning
    type: "checkboxes"
    label: "Encode tuning"
    label_ru: "Тюнинг кодирования"
    tooltip: "x264/x265 tune values. Hardware encoders use their own quality controls and ignore this list, so it stays CPU-only."
    tooltip_ru: "Значения tune для x264/x265. Аппаратные кодеры используют свои регуляторы качества и не читают этот список, поэтому он доступен только для CPU."
    default: []
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    options:
      - {value: "grain", label: "Grain", label_ru: "Grain"}
      - {value: "film", label: "Film", label_ru: "Film"}
      - {value: "animation", label: "Animation", label_ru: "Animation"}
      - {value: "fastdecode", label: "Fast decode", label_ru: "Fast decode"}
      - {value: "zerolatency", label: "Zero latency", label_ru: "Zero latency"}

  audio_mode: &audio_mode
    id: audio_mode
    tooltip: "Audio policy for the output: stream copy, lossy/lossless encode, PCM depth, or no audio. MXF permits only compatible PCM modes."
    tooltip_ru: "Политика аудио результата: copy потока, lossy/lossless-кодирование, разрядность PCM или без аудио. Для MXF доступны только совместимые PCM-режимы."
    type: "radio"
    group: "audio"
    choice_style: "buttons"
    layout: "four_columns"
    span: "full"
    refresh_on_change: true
    label: "Audio"
    label_ru: "Аудио"
    default: "source"
    options:
      - {value: "source", label: "COPY", label_ru: "COPY", tone: "copy"}
      - {value: "aac_320", label: "AAC override", label_ru: "AAC override", tone: "lossy"}
      - {value: "mp3", label: "MP3", label_ru: "MP3", tone: "lossy"}
      - {value: "flac", label: "FLAC", label_ru: "FLAC", tone: "lossless"}
      - {value: "pcm_s16", label: "PCM 16-bit", label_ru: "PCM 16-bit", tone: "uncompressed"}
      - {value: "pcm_s24", label: "PCM 24-bit", label_ru: "PCM 24-bit", tone: "uncompressed"}
      - {value: "pcm_f32", label: "PCM float", label_ru: "PCM float", tone: "uncompressed"}
      - {value: "none", label: "No audio", label_ru: "Без аудио", tone: "utility"}

  mxf_safe_audio_mode: &mxf_safe_audio_mode
    id: audio_mode
    tooltip: "Audio policy for the output: stream copy, lossy/lossless encode, PCM depth, or no audio. MXF permits only compatible PCM modes."
    tooltip_ru: "Политика аудио результата: copy потока, lossy/lossless-кодирование, разрядность PCM или без аудио. Для MXF доступны только совместимые PCM-режимы."
    type: "radio"
    group: "audio"
    choice_style: "buttons"
    layout: "four_columns"
    span: "full"
    refresh_on_change: true
    label: "Audio"
    label_ru: "Аудио"
    default: "source"
    options:
      - {value: "source", label: "COPY", label_ru: "COPY", tone: "copy", disabled_if: {output_container: "mxf"}}
      - {value: "aac_320", label: "AAC override", label_ru: "AAC override", tone: "lossy", disabled_if: {output_container: "mxf"}}
      - {value: "mp3", label: "MP3", label_ru: "MP3", tone: "lossy", disabled_if: {output_container: "mxf"}}
      # The MOV muxer answers "flac only supported in MP4".
      - {value: "flac", label: "FLAC", label_ru: "FLAC", tone: "lossless", disabled_if: {output_container: ["mxf", "mov"]}}
      - {value: "pcm_s16", label: "PCM 16-bit", label_ru: "PCM 16-bit", tone: "uncompressed"}
      - {value: "pcm_s24", label: "PCM 24-bit", label_ru: "PCM 24-bit", tone: "uncompressed"}
      - {value: "pcm_f32", label: "PCM float", label_ru: "PCM float", tone: "uncompressed", disabled_if: {output_container: "mxf"}}
      - {value: "none", label: "No audio", label_ru: "Без аудио", tone: "utility"}

  mp3_lame_preset_encode: &mp3_lame_preset_encode
    id: mp3_lame_preset
    tooltip: "LAME quality mode for MP3 output."
    tooltip_ru: "Режим качества LAME для MP3."
    type: "radio"
    group: "lame"
    choice_style: "buttons"
    layout: "three_columns"
    span: "full"
    refresh_on_change: true
    visible_if: {audio_mode: "mp3"}
    label: "MP3 / LAME"
    label_ru: "MP3 / LAME"
    default: "v0"
    options:
      - {value: "v0", label: "VBR V0", label_ru: "VBR V0", tone: "lossy",
         description: "Best VBR V0 / Extreme, about 245 kbps.", description_ru: "Best VBR V0 / Extreme, примерно 245 kbps."}
      - {value: "insane", label: "Insane 320", label_ru: "Insane 320", tone: "lossy",
         description: "Insane CBR 320 kbps.", description_ru: "Insane CBR 320 kbps."}
      - {value: "bitrate", label: "By bitrate", label_ru: "По битрейту", tone: "lossy",
         description: "Use the Audio bitrate field, up to the 320 kbps LAME ceiling.",
         description_ru: "Взять значение поля «Битрейт аудио», максимум 320 kbps."}

  audio_bitrate: &audio_bitrate
    id: audio_bitrate
    tooltip: "The bitrate of a lossy sound: AAC, Opus (at most 256 kbps), and MP3 when its LAME preset is By bitrate (at most 320 kbps)."
    tooltip_ru: "Битрейт сжатого звука: AAC, Opus (не выше 256 кбит/с) и MP3, когда его пресет LAME - «По битрейту» (не выше 320 кбит/с)."
    type: "select"
    label: "Audio bitrate"
    label_ru: "Битрейт аудио"
    default: "384k"
    visible_if:
      any:
        - {audio_mode: "aac_320"}
        - {all: [{audio_mode: "mp3"}, {mp3_lame_preset: "bitrate"}]}
    options:
      - {value: "192k", label: "192 kbps", label_ru: "192 kbps"}
      - {value: "256k", label: "256 kbps", label_ru: "256 kbps"}
      - {value: "320k", label: "320 kbps", label_ru: "320 kbps"}
      # MPEG-1 Layer III stops at 320 kbps. The key differs per page: encode
      # pages ask through audio_mode, the Audio page through audio_format.
      - {value: "384k", label: "384 kbps", label_ru: "384 kbps", disabled_if: {any: [{audio_mode: "mp3"}, {audio_format: "mp3"}]}}

  audio_sample_rate: &audio_sample_rate
    id: audio_sample_rate
    tooltip: "Target sample rate. Source keeps the original rate."
    tooltip_ru: "Целевая частота дискретизации. Родная оставляет исходную частоту."
    type: "radio"
    group: "audio"
    choice_style: "buttons"
    layout: "four_columns"
    span: "full"
    visible_if: {audio_mode: ["aac_320", "mp3", "flac", "pcm_s16", "pcm_s24", "pcm_f32"]}
    label: "Sample rate"
    label_ru: "Частота дискретизации"
    default: "source"
    options:
      - {value: "source", label: "COPY", label_ru: "COPY"}
      - {value: "44100", label: "44.1 kHz", label_ru: "44.1 kHz"}
      - {value: "48000", label: "48 kHz", label_ru: "48 kHz"}
      - {value: "88200", label: "88.2 kHz", label_ru: "88.2 kHz"}
      - {value: "96000", label: "96 kHz", label_ru: "96 kHz"}
      - {value: "176400", label: "176.4 kHz", label_ru: "176.4 kHz"}
      - {value: "192000", label: "192 kHz", label_ru: "192 kHz"}

  cpu_encoder_preset: &cpu_encoder_preset
    id: cpu_encoder_preset
    type: "radio"
    choice_style: "buttons"
    layout: "five_columns"
    label: "CPU preset"
    label_ru: "CPU preset"
    tooltip: "Software x264/x265 speed-compression preset. Slower presets spend more CPU searching for a cleaner/smaller encode at the same CRF."
    tooltip_ru: "Software x264/x265 preset скорости/сжатия. Более медленные presets тратят больше CPU на более чистое/компактное кодирование при том же CRF."
    default: "medium"
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    options:
      - {value: "fast", label: "fast", label_ru: "fast", tooltip: "Faster CPU encode; useful for review or quick tests.", tooltip_ru: "Быстрее на CPU; удобно для просмотровых файлов и быстрых тестов."}
      - {value: "medium", label: "medium", label_ru: "medium", tooltip: "Balanced x264/x265 default-style preset.", tooltip_ru: "Сбалансированный preset в духе стандартного x264/x265."}
      - {value: "slow", label: "slow", label_ru: "slow", tooltip: "Good production default when time is acceptable.", tooltip_ru: "Хороший рабочий вариант, когда время кодирования приемлемо."}
      - {value: "slower", label: "slower", label_ru: "slower", tooltip: "More CPU search for difficult material or final storage masters.", tooltip_ru: "Больше CPU-поиска для сложного материала или финального хранения."}
      - {value: "veryslow", label: "veryslow", label_ru: "veryslow", tooltip: "Maximum x264/x265 preset effort; often diminishing returns.", tooltip_ru: "Максимальное усилие x264/x265 preset; часто с убывающей отдачей."}

  nvenc_preset: &nvenc_preset
    id: nvenc_preset
    type: "radio"
    choice_style: "buttons"
    layout: "three_columns"
    label: "NVENC preset"
    label_ru: "NVENC preset"
    tooltip: "NVIDIA NVENC P-preset. This is a hardware encoder scale, not an equivalent of CPU slow/slower/veryslow."
    tooltip_ru: "NVIDIA NVENC P-preset. Это шкала аппаратного кодера, не эквивалент CPU slow/slower/veryslow."
    default: "p6"
    visible_if: {encode_backend: "cuda"}
    options:
      - {value: "p5", label: "NVENC p5", label_ru: "NVENC p5", tooltip: "Good quality; useful for faster GPU delivery/review encodes.", tooltip_ru: "Good quality; быстрый GPU-вариант для delivery/review."}
      - {value: "p6", label: "NVENC p6", label_ru: "NVENC p6", tooltip: "Better quality; good upper default for careful NVENC encodes.", tooltip_ru: "Better quality; хороший верхний default для аккуратного NVENC."}
      - {value: "p7", label: "NVENC p7", label_ru: "NVENC p7", tooltip: "Best quality in the NVENC P-scale; slower on GPU.", tooltip_ru: "Best quality в NVENC P-scale; медленнее на GPU."}

  qsv_encoder_preset: &qsv_encoder_preset
    id: qsv_encoder_preset
    type: "radio"
    choice_style: "buttons"
    layout: "seven_columns"
    span: "full"
    label: "QSV preset"
    label_ru: "QSV preset"
    tooltip: "Intel QuickSync preset. QSV has its own preset line exposed by FFmpeg: veryfast, faster, fast, medium, slow, slower, veryslow."
    tooltip_ru: "Intel QuickSync preset. У QSV своя FFmpeg-линейка: veryfast, faster, fast, medium, slow, slower, veryslow."
    default: "medium"
    visible_if: {encode_backend: "qsv"}
    options:
      - {value: "veryfast", label: "veryfast", label_ru: "veryfast", tooltip: "Fastest QSV preset.", tooltip_ru: "Самый быстрый QSV preset."}
      - {value: "faster", label: "faster", label_ru: "faster", tooltip: "Faster QSV preset.", tooltip_ru: "Быстрый QSV preset."}
      - {value: "fast", label: "fast", label_ru: "fast", tooltip: "Fast QSV preset with more quality headroom than veryfast/faster.", tooltip_ru: "Быстрый QSV preset с большим запасом качества, чем veryfast/faster."}
      - {value: "medium", label: "medium", label_ru: "medium", tooltip: "Balanced QSV preset.", tooltip_ru: "Сбалансированный QSV preset."}
      - {value: "slow", label: "slow", label_ru: "slow", tooltip: "Higher quality QSV preset.", tooltip_ru: "Более качественный QSV preset."}
      - {value: "slower", label: "slower", label_ru: "slower", tooltip: "More careful QSV preset.", tooltip_ru: "Более тщательный QSV preset."}
      - {value: "veryslow", label: "veryslow", label_ru: "veryslow", tooltip: "Maximum QSV preset effort exposed by FFmpeg.", tooltip_ru: "Максимальное усилие QSV preset, доступное через FFmpeg."}

  amf_quality: &amf_quality
    id: amf_quality
    type: "radio"
    choice_style: "buttons"
    layout: "three_columns"
    label: "AMF quality"
    label_ru: "AMF quality"
    tooltip: "AMD AMF quality preset. This controls AMF's speed/balanced/quality mode; CQ/QP still controls quantization level."
    tooltip_ru: "AMD AMF quality preset. Управляет AMF режимом speed/balanced/quality; CQ/QP по-прежнему задаёт уровень квантования."
    default: "quality"
    visible_if: {encode_backend: "amd"}
    options:
      - {value: "speed", label: "speed", label_ru: "speed", tooltip: "Prefer AMF encoding speed.", tooltip_ru: "Приоритет скорости AMF."}
      - {value: "balanced", label: "balanced", label_ru: "balanced", tooltip: "Balanced AMF quality/speed mode.", tooltip_ru: "Сбалансированный режим AMF качество/скорость."}
      - {value: "quality", label: "quality", label_ru: "quality", tooltip: "Prefer AMF quality.", tooltip_ru: "Приоритет качества AMF."}

  pix_fmt: &pix_fmt
    id: pix_fmt
    tooltip: "Output pixel format and bit depth. Keep it compatible with the selected codec and delivery/editing workflow."
    tooltip_ru: "Pixel format и разрядность результата. Значение должно соответствовать выбранному кодеку и монтажному либо delivery-сценарию."
    type: "select"
    label: "Pixel format"
    label_ru: "Pixel format"
    default: "auto"
    options:
      - {value: "auto", label: "auto", label_ru: "auto"}
      - {value: "yuv420p", label: "yuv420p", label_ru: "yuv420p"}
      - {value: "yuv420p10le", label: "yuv420p10le", label_ru: "yuv420p10le"}
      - {value: "yuv422p", label: "yuv422p", label_ru: "yuv422p"}
      - {value: "yuv422p10le", label: "yuv422p10le", label_ru: "yuv422p10le"}

  output_resolution: &output_resolution
    id: output_resolution
    tooltip: "Optional scaling target. Source keeps the original frame size."
    tooltip_ru: "Необязательное масштабирование. Исходное сохраняет размер кадра."
    type: "select"
    label: "Resolution"
    label_ru: "Разрешение"
    default: "source"
    options:
      - {value: "source", label: "Source", label_ru: "Исходное"}
      - {value: "2160", label: "2160p", label_ru: "2160p"}
      - {value: "1440", label: "1440p", label_ru: "1440p"}
      - {value: "1080", label: "1080p", label_ru: "1080p"}
      - {value: "720", label: "720p", label_ru: "720p"}
      - {value: "480", label: "480p", label_ru: "480p"}

  scan_mode: &scan_mode
    id: scan_mode
    tooltip: "What becomes of a source of two fields (25i, 29.97i, 50i). Progressive x2, the default: bwdif makes a frame of each field, the rate doubled and the motion whole - 50i becomes 50p. Progressive: a whole frame of each frame, the rate kept. Keep fields: the fields and their order stay, for an interlaced broadcast. A progressive source is not touched."
    tooltip_ru: "Что станет с источником из двух полей (25i, 29,97i, 50i). «Прогрессив x2», по умолчанию: bwdif делает кадр из каждого поля, частота вдвое выше, движение целиком - 50i становится 50p. «Прогрессив»: цельный кадр из каждого кадра, частота прежняя. «Оставить поля»: поля и их порядок сохраняются - для чересстрочного эфира. Прогрессивный источник не трогается."
    type: "radio"
    priority: "rare"
    label: "Interlaced source"
    label_ru: "Чересстрочный источник"
    default: "double"
    options:
      - {value: "keep", label: "Keep fields", label_ru: "Оставить поля", tooltip: "The fields and their order stay as they are; x264 codes them as fields.", tooltip_ru: "Поля и их порядок остаются; x264 кодирует их как поля."}
      - {value: "progressive", label: "Progressive", label_ru: "Прогрессив", tooltip: "bwdif: a whole frame of each frame, the rate kept - 50i becomes 25p.", tooltip_ru: "bwdif: цельный кадр из каждого кадра, частота прежняя - 50i становится 25p."}
      - {value: "double", label: "Progressive x2", label_ru: "Прогрессив x2", tooltip: "bwdif: a frame of each field, the rate doubled - 50i becomes 50p, the motion smooth.", tooltip_ru: "bwdif: кадр из каждого поля, частота вдвое выше - 50i становится 50p, движение плавное."}

  output_container: &output_container
    id: output_container
    tooltip: "Container for encoded output when the selected codec family allows it."
    tooltip_ru: "Контейнер результата, если выбранное семейство кодеков его допускает."
    type: "radio"
    choice_style: "buttons"
    layout: "three_columns"
    label: "Container"
    label_ru: "Контейнер"
    default: "mp4"
    span: "full"
    refresh_on_change: true
    options:
      - {value: "mp4", label: "MP4", label_ru: "MP4"}
      - {value: "mkv", label: "MKV", label_ru: "MKV"}
      - {value: "mov", label: "MOV", label_ru: "MOV"}

  editing_output_container: &editing_output_container
    id: output_container
    tooltip: "Container for encoded output when the selected codec family allows it."
    tooltip_ru: "Контейнер результата, если выбранное семейство кодеков его допускает."
    type: "radio"
    choice_style: "buttons"
    layout: "two_columns"
    label: "Container"
    label_ru: "Контейнер"
    default: "mov"
    span: "full"
    refresh_on_change: true
    options:
      - {value: "mov", label: "MOV", label_ru: "MOV"}
      - {value: "mxf", label: "MXF", label_ru: "MXF"}

  crf: &crf
    id: crf
    tooltip: "Quality target for software encoders: lower means larger and cleaner."
    tooltip_ru: "Цель качества для software-кодеков: ниже означает крупнее и чище."
    type: "number"
    label: "CRF"
    label_ru: "CRF"
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    default: 14
    min: 0
    max: 40
    step: 1

  cq: &cq
    id: cq
    tooltip: "Constant-quality value for hardware encoders."
    tooltip_ru: "Constant Quality для аппаратных кодировщиков."
    type: "number"
    label: "CQ/QP"
    label_ru: "CQ/QP"
    visible_if: {encode_backend: ["cuda", "qsv", "amd"]}
    default: 14
    min: 0
    max: 40
    step: 1

  av1_preset: &av1_preset
    id: av1_preset
    type: "select"
    label: "SVT-AV1 preset"
    label_ru: "SVT-AV1 preset"
    tooltip: "Software SVT-AV1 speed/quality preset. Hardware AV1 encoders use their own NVENC/QSV/AMF scales instead."
    tooltip_ru: "Preset скорости/качества software SVT-AV1. Аппаратные AV1-кодеры используют свои шкалы NVENC/QSV/AMF."
    default: "6"
    visible_if: {target_codecs: ["svt_av1"]}
    hidden_if: {encode_backend: ["cuda", "qsv", "amd"]}
    options:
      - {value: "4", label: "4 quality", label_ru: "4 quality"}
      - {value: "6", label: "6 balanced", label_ru: "6 balanced"}
      - {value: "8", label: "8 fast", label_ru: "8 fast"}

  overwrite: &overwrite
    id: overwrite
    tooltip: "Allow FFmpeg to replace existing output files."
    tooltip_ru: "Разрешить FFmpeg заменять существующие выходные файлы."
    type: "checkbox"
    label: "Overwrite"
    label_ru: "Перезаписывать"
    default: false

  limit_first_file: &limit_first_file
    id: limit_first_file
    type: "checkbox"
    label: "Test on first file"
    label_ru: "Тест: первый файл"
    hint: "Process only the first matching file, useful for checking a preset before a full batch."
    hint_ru: "Обработать только первый найденный файл, удобно для проверки пресета перед всей папкой."
    default: false

  dry_run: &dry_run
    id: dry_run
    tooltip: "Print commands without processing media."
    tooltip_ru: "Показать команды без обработки медиа."
    type: "checkbox"
    label: "Dry run"
    label_ru: "Только показать команду"
    default: false

operations:
  - id: inventory
    title: "Inventory"
    title_ru: "Инвентаризация"
    description: "Count project folders."
    description_ru: "Посчитать файлы в Источнике, Назначении и LUTs."
    service: "system_core.services.media_service:inventory"
    kind: "safe"

  - id: selftest
    title: "Selftest"
    title_ru: "Самопроверка"
    description: "Check ffmpeg, ffprobe, yt-dlp and Deno."
    description_ru: "Проверить ffmpeg, ffprobe, yt-dlp и Deno."
    service: "system_core.services.media_service:selftest"
    kind: "safe"

operation_groups:
  - id: youtube
    title: "Download / YouTube"
    title_ru: "Скачивание / YouTube"
    description: "Native yt-dlp profiles, no download archive by default."
    description_ru: "Нативные профили yt-dlp, архив скачиваний по умолчанию выключен."
    fields:
      - id: youtube_preset
        tooltip: "A preset fills the fields of the download in one click; any of them can be changed afterwards."
        tooltip_ru: "Пресет одним нажатием заполняет поля загрузки; любое из них можно потом поменять."
        type: "profile_select"
        label: "Download profile"
        label_ru: "Профиль скачивания"
        default: "best_video"
        presets:
          - id: best_video
            label: "Best MP4 video"
            label_ru: "Best MP4 video"
            description: "Best available MP4/M4A merge for general use."
            description_ru: "Лучшее доступное MP4/M4A для обычной загрузки."
            values:
              youtube_profile: "best_mp4"
              youtube_source_mode: "single"
              youtube_resolution: "best"
              youtube_video_codec: "auto"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_client: "default"
              youtube_options: ["safe_retries", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 8
              download_archive: false
          - id: upload_1080_avc
            label: "1080p AVC MP4"
            label_ru: "1080p AVC MP4"
            description: "YouTube-friendly 1080p AVC preference."
            description_ru: "Предпочтение 1080p AVC для совместимости и заливки."
            values:
              youtube_profile: "upload_ready"
              youtube_source_mode: "single"
              youtube_resolution: "1080"
              youtube_video_codec: "avc"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_options: ["safe_retries", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 8
              download_archive: false
          - id: safe_safari
            label: "Safe Safari"
            label_ru: "Safe Safari"
            description: "Slower Safari client, retries and IPv4 for fragile downloads."
            description_ru: "Медленный Safari-клиент, повторы и IPv4 для капризных ссылок."
            values:
              youtube_profile: "safe_mp4"
              youtube_source_mode: "single"
              youtube_resolution: "best"
              youtube_video_codec: "auto"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_client: "safari"
              youtube_options: ["safe_retries", "force_ipv4", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 1
              download_archive: false
          - id: av1_if_available
            label: "AV1 if available"
            label_ru: "AV1 если доступен"
            description: "Prefer AV1 video while keeping MP4 output."
            description_ru: "Предпочитать AV1-видео, оставляя MP4-контейнер."
            values:
              youtube_profile: "video_custom"
              youtube_source_mode: "single"
              youtube_resolution: "best"
              youtube_video_codec: "av1"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_options: ["safe_retries", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 8
              download_archive: false
          - id: audio_mp3
            label: "Audio MP3"
            label_ru: "Audio MP3"
            description: "Audio-only MP3 extraction."
            description_ru: "Извлечение только аудио в MP3."
            values:
              youtube_profile: "audio_custom"
              youtube_source_mode: "single"
              youtube_audio_format: "mp3"
              youtube_options: ["safe_retries", "embed_metadata", "no_playlist"]
              subtitle_options: []
              parallel_fragments: 8
              download_archive: false
          - id: batch_best
            label: "Batch from urls.txt"
            label_ru: "Batch из urls.txt"
            description: "Read links from input\\urls.txt."
            description_ru: "Читать ссылки из input\\urls.txt."
            values:
              youtube_profile: "best_mp4"
              youtube_source_mode: "batch"
              youtube_resolution: "best"
              youtube_video_codec: "auto"
              youtube_audio_format: "source"
              youtube_container: "mp4"
              youtube_options: ["safe_retries", "embed_metadata"]
              subtitle_options: []
              parallel_fragments: 8
              download_archive: false
      - id: youtube_url
        tooltip: "The link of a video - or of a playlist when Source is Playlist. yt-dlp takes YouTube and most video sites."
        tooltip_ru: "Ссылка на видео, а при Источнике «Плейлист» - на плейлист. yt-dlp берёт YouTube и большинство видеосайтов."
        type: "text"
        label: "URL"
        label_ru: "URL"
        default: ""
        placeholder: "https://www.youtube.com/watch?v=..."
        span: "full"
      - id: youtube_sections
        type: "text"
        label: "Section"
        label_ru: "Фрагмент"
        default: ""
        placeholder: "*00:01:00-00:02:00"
        priority: "advanced"
        tooltip: "A part of the video only, as yt-dlp writes it: *start-end. Empty - the whole video."
        tooltip_ru: "Только часть видео, в записи yt-dlp: *начало-конец. Пусто - видео целиком."
      - id: youtube_playlist_items
        type: "text"
        label: "Playlist items"
        label_ru: "Диапазон списка"
        default: ""
        placeholder: "1-10,15"
        priority: "advanced"
        visible_if: {youtube_source_mode: "playlist"}
        tooltip: "Which videos of the playlist, by their numbers in it: 1-10,15, or -5: for the last five. Empty - the whole playlist."
        tooltip_ru: "Какие видео плейлиста, по их номерам в нём: 1-10,15 или -5: - последние пять. Пусто - плейлист целиком."
      - id: batch_file
        tooltip: "A text file of links, one a line. The default input\\urls.txt is urls.txt of the Source, wherever the Source is."
        tooltip_ru: "Текстовый файл ссылок, по одной в строке. По умолчанию input\\urls.txt - это urls.txt Источника, где бы Источник ни был."
        type: "file"
        label: "Batch file"
        label_ru: "Файл ссылок"
        default: "input\\urls.txt"
        file_filter: "Text files (*.txt)|*.txt|All files (*.*)|*.*"
      - id: youtube_profile
        tooltip: "How yt-dlp picks the formats. Best MP4: the best picture, with M4A sound where the site has it, in MP4. Safe MP4: the same, one fragment at a time, with retries, pauses, IPv4 and the Safari client, for a link that breaks off. Custom video and Upload ready: by the resolution, codec and container below. Custom audio: the sound alone. Subtitles only: no video."
        tooltip_ru: "Как yt-dlp выбирает форматы. «Лучшее MP4» - лучшая картинка со звуком M4A, где он есть у сайта, в MP4. «Надёжное MP4» - то же по одному фрагменту, с повторами, паузами, IPv4 и клиентом Safari, для ссылки, которая обрывается. «Своё видео» и «Для загрузки» - по разрешению, кодеку и контейнеру ниже. «Своё аудио» - только звук. «Только субтитры» - без видео."
        type: "select"
        label: "Engine profile"
        label_ru: "Форматный профиль"
        default: "best_mp4"
        options:
          - {value: "best_mp4", label: "Best MP4", label_ru: "Best MP4"}
          - {value: "safe_mp4", label: "Safe MP4", label_ru: "Safe MP4"}
          - {value: "video_custom", label: "Custom video", label_ru: "Custom video"}
          - {value: "upload_ready", label: "Upload ready", label_ru: "Upload ready"}
          - {value: "audio_custom", label: "Custom audio", label_ru: "Custom audio"}
          - {value: "subs_only", label: "Subtitles only", label_ru: "Только субтитры"}
      - id: youtube_resolution
        tooltip: "The limit of the resolution: the best one up to it. Best - the highest the site has."
        tooltip_ru: "Предел разрешения: берётся лучшее не выше него. «Лучшее» - самое высокое, какое есть у сайта."
        type: "select"
        label: "Resolution"
        label_ru: "Разрешение"
        default: "best"
        options:
          - {value: "best", label: "Best", label_ru: "Лучшее"}
          - {value: "2160", label: "2160p", label_ru: "2160p"}
          - {value: "1440", label: "1440p", label_ru: "1440p"}
          - {value: "1080", label: "1080p", label_ru: "1080p"}
          - {value: "720", label: "720p", label_ru: "720p"}
          - {value: "480", label: "480p", label_ru: "480p"}
      - id: youtube_video_codec
        tooltip: "The codec to prefer, not to demand: without it the best other one comes. H.264 in MP4 comes with AAC sound, for editors and upload forms that take no Opus."
        tooltip_ru: "Кодек, которому отдаётся предпочтение, а не требование: без него придёт лучший другой. H.264 в MP4 приходит со звуком AAC - для монтажа и форм загрузки, которые не берут Opus."
        type: "select"
        label: "Video codec"
        label_ru: "Видео кодек"
        default: "auto"
        options:
          - {value: "auto", label: "Auto", label_ru: "Auto"}
          - {value: "avc", label: "AVC / H.264", label_ru: "AVC / H.264"}
          - {value: "av1", label: "AV1", label_ru: "AV1"}
          - {value: "vp9", label: "VP9", label_ru: "VP9"}
      - id: youtube_audio_format
        tooltip: "The sound of Custom audio. Source: the best sound as the site keeps it, not re-encoded. M4A: the AAC of the site where it has one, else converted. Opus and MP3 (VBR V0): the sound in that codec, converted by FFmpeg where the site keeps another."
        tooltip_ru: "Звук «Своего аудио». «Родной» - лучший звук, как его хранит сайт, без перекодирования. M4A - AAC сайта, если он есть, иначе перекодирование. Opus и MP3 (VBR V0) - звук в этом кодеке, FFmpeg перекодирует, если у сайта другой."
        type: "select"
        label: "Audio format"
        label_ru: "Формат аудио"
        default: "source"
        options:
          - {value: "source", label: "Source / native", label_ru: "Родной"}
          - {value: "m4a", label: "M4A", label_ru: "M4A"}
          - {value: "opus", label: "Opus", label_ru: "Opus"}
          - {value: "mp3", label: "MP3", label_ru: "MP3"}
      - id: youtube_container
        tooltip: "The container the picture and the sound are merged into."
        tooltip_ru: "Контейнер, в который сводятся картинка и звук."
        type: "radio"
        choice_style: "buttons"
        layout: "three_columns"
        label: "Container"
        label_ru: "Контейнер"
        default: "mp4"
        options:
          - {value: "mp4", label: "MP4", label_ru: "MP4"}
          - {value: "mkv", label: "MKV", label_ru: "MKV"}
          - {value: "webm", label: "WEBM", label_ru: "WEBM"}
      - id: youtube_source_mode
        tooltip: "Where the links come from: one link, the list of input\\urls.txt, or a whole playlist."
        tooltip_ru: "Откуда ссылки: одна ссылка, список input\\urls.txt или весь плейлист."
        type: "radio"
        choice_style: "buttons"
        layout: "three_columns"
        label: "Source"
        label_ru: "Источник"
        default: "single"
        options:
          - {value: "single", label: "Single URL", label_ru: "Одна ссылка"}
          - {value: "batch", label: "input\\urls.txt", label_ru: "input\\urls.txt"}
          - {value: "playlist", label: "Playlist", label_ru: "Плейлист", tooltip: "The link is a playlist: every video of it, numbered in its order; a video that fails is passed over.", tooltip_ru: "Ссылка - плейлист: все его видео, с номерами по порядку; видео, которое не скачалось, пропускается."}
      - id: youtube_options
        tooltip: "Retries: ten tries for a request and for a fragment, two seconds apart. IPv4: IPv4 connections only. Metadata + thumbnail: the tags and the cover into the file. No playlist: for the links of input\\urls.txt - of a link to a video in a playlist, the video alone; one link always takes its video alone, Playlist takes the whole list."
        tooltip_ru: "«Повторы» - десять попыток на запрос и на фрагмент, через две секунды. IPv4 - только соединения IPv4. «Метаданные + обложка» - теги и обложка в файл. «Без плейлиста» - для ссылок из input\\urls.txt: из ссылки на видео в плейлисте только это видео; одна ссылка всегда берёт только своё видео, «Плейлист» - весь список."
        type: "checkboxes"
        label: "Download tuning"
        label_ru: "Тюнинг скачивания"
        default: []
        options:
          - {value: "safe_retries", label: "Retries", label_ru: "Повторы"}
          - {value: "force_ipv4", label: "IPv4", label_ru: "IPv4"}
          - {value: "embed_metadata", label: "Metadata + thumbnail", label_ru: "Метаданные + обложка"}
          - {value: "no_playlist", label: "No playlist", label_ru: "Без плейлиста"}
      - id: subtitle_options
        tooltip: "Manual: the subtitles people wrote, as files beside the video. Auto: the ones the site made itself. Embed: the subtitles inside the video file."
        tooltip_ru: "«Ручные» - субтитры, написанные людьми, файлами рядом с видео. «Авто» - сделанные самим сайтом. «Встроить» - субтитры внутрь файла видео."
        type: "checkboxes"
        label: "Subtitles"
        label_ru: "Субтитры"
        default: []
        options:
          - {value: "write_subs", label: "Manual", label_ru: "Ручные"}
          - {value: "write_auto_subs", label: "Auto", label_ru: "Авто"}
          - {value: "embed_subs", label: "Embed", label_ru: "Встроить"}
      - id: parallel_fragments
        tooltip: "How many fragments of one video are downloaded at once (yt-dlp -N). More is faster on a good line; a site that limits may answer with errors."
        tooltip_ru: "Сколько фрагментов одного видео качается одновременно (yt-dlp -N). Больше - быстрее на хорошем канале; сайт с ограничениями может ответить ошибками."
        type: "number"
        label: "Parallel"
        label_ru: "Потоки"
        default: 8
        min: 1
        max: 16
        step: 1
      - id: youtube_client
        tooltip: "Which YouTube player yt-dlp presents itself as. Default suits most links; Safari or Android when formats are missing or the speed is cut."
        tooltip_ru: "Каким плеером YouTube представляется yt-dlp. Default подходит большинству ссылок; Safari или Android - когда не хватает форматов или режется скорость."
        type: "radio"
        choice_style: "buttons"
        layout: "three_columns"
        label: "Client"
        label_ru: "Клиент"
        default: "default"
        priority: "advanced"
        options:
          - {value: "default", label: "Default", label_ru: "Default"}
          - {value: "safari", label: "Safari", label_ru: "Safari"}
          - {value: "android", label: "Android", label_ru: "Android"}
      - id: subtitle_languages
        tooltip: "The languages of the subtitles, comma-separated; a pattern is allowed: en.* takes en, en-US, en-GB."
        tooltip_ru: "Языки субтитров через запятую; можно шаблоном: en.* берёт en, en-US, en-GB."
        type: "text"
        label: "Subtitle languages"
        label_ru: "Языки субтитров"
        default: "ru,en.*"
        priority: "advanced"
      - id: cookies_source
        tooltip: "Where yt-dlp takes the cookies of a link that wants a sign-in. A browser: yt-dlp reads its profile at the download and the program keeps nothing; Chrome and Edge seal their cookies with their own encryption, and yt-dlp may fail to read them - Firefox is the sure one. File: the copy taken with TAKE UNDER DPAPI, kept sealed for this account of Windows; without it, the file of the field Cookies file when it is there. None: no cookies."
        tooltip_ru: "Откуда yt-dlp берёт cookies для ссылки, которой нужен вход. Браузер: yt-dlp читает его профиль в момент загрузки, программа ничего не хранит; Chrome и Edge закрывают cookies своим шифрованием, и yt-dlp может их не прочитать - надёжнее Firefox. Файл: копия, взятая кнопкой «Взять под DPAPI», хранится запечатанной для этой учётной записи Windows; без неё - файл поля «Файл cookies», если он есть. Нет: без cookies."
        type: "radio"
        choice_style: "buttons"
        label: "Cookies"
        label_ru: "Cookies"
        default: "file"
        priority: "advanced"
        options:
          - {value: "none", label: "None", label_ru: "Нет"}
          - {value: "chrome", label: "Chrome", label_ru: "Chrome"}
          - {value: "edge", label: "Edge", label_ru: "Edge"}
          - {value: "firefox", label: "Firefox", label_ru: "Firefox"}
          - {value: "brave", label: "Brave", label_ru: "Brave"}
          - {value: "file", label: "File", label_ru: "Файл"}
      - id: cookies_path
        tooltip: "A cookies file of a browser (Netscape format, cookies.txt) for a link that wants a sign-in. TAKE UNDER DPAPI keeps a sealed copy of it, and the open file is no longer needed; without the copy the file is read as it is, when it is there."
        tooltip_ru: "Файл cookies браузера (формат Netscape, cookies.txt) для ссылки, которой нужен вход. «Взять под DPAPI» хранит его запечатанную копию, и открытый файл больше не нужен; без копии файл читается как есть, если он есть."
        type: "file"
        file_filter: "Cookies (*.txt)|*.txt|All files (*.*)|*.*"
        label: "Cookies file"
        label_ru: "Файл cookies"
        default: "config\\cookies.txt"
        priority: "advanced"
      - id: download_archive
        tooltip: "Remembers what was downloaded in config\\download-archive.txt; a link already there is passed over."
        tooltip_ru: "Запоминает скачанное в config\\download-archive.txt; ссылка, которая там уже есть, пропускается."
        type: "checkbox"
        label: "Use download archive"
        label_ru: "Вести архив скачиваний"
        default: false
        priority: "advanced"
      - id: youtube_dry_run
        tooltip: "Says the yt-dlp command and runs nothing."
        tooltip_ru: "Показывает команду yt-dlp и ничего не запускает."
        type: "checkbox"
        label: "Dry run"
        label_ru: "Только показать команду"
        default: false
    children:
      - id: youtube_run
        title: "Download"
        title_ru: "Скачать"
        description: "Run the selected yt-dlp profile."
        description_ru: "Запустить выбранный профиль yt-dlp."
        service: "system_core.services.media_service:download_youtube"
        kind: "safe"
      - id: youtube_formats
        title: "Formats of the link"
        title_ru: "Форматы ссылки"
        description: "What formats the link offers - resolution, codecs, size - listed in the journal, nothing downloaded. One of them is taken with the profile Own video."
        description_ru: "Какие форматы есть у ссылки - разрешение, кодеки, размер - списком в журнале, ничего не скачивается. Взять один из них - профилем «Своё видео»."
        service: "system_core.services.media_service:list_youtube_formats"
        kind: "safe"
      - id: youtube_cookies_import
        title: "Take under DPAPI"
        title_ru: "Взять под DPAPI"
        description: "The cookies file of the field Cookies file sealed with DPAPI for this account of Windows into config\\cookies.dpapi: downloads with Cookies - File take this copy, and the open file is no longer needed."
        description_ru: "Файл поля «Файл cookies» запечатывается DPAPI для этой учётной записи Windows в config\\cookies.dpapi: загрузки с Cookies - «Файл» берут эту копию, и открытый файл больше не нужен."
        service: "system_core.services.media_service:import_youtube_cookies"
        kind: "safe"

  - id: audio
    title: "Audio streams"
    title_ru: "Аудиопотоки"
    description: "Extract, resample, normalize and package audio."
    description_ru: "Извлечение, ресемплинг, нормализация и упаковка аудио."
    fields:
      - id: audio_profile
        type: "profile_buttons"
        label: "Audio mode"
        label_ru: "Режим работы"
        hint: "Buttons update the parameters below; you can still fine-tune streams, containers, LUFS and channels after choosing a mode."
        hint_ru: "Кнопки меняют параметры ниже; после выбора режима можно вручную уточнить потоки, контейнеры, LUFS и каналы."
        default: "copy_auto"
        # A profile sets the sound, never the workflow: the operator's choice of
        # Extract / Convert stays put. Only the two VIDEO presets switch to
        # in_video, because they describe nothing outside it.
        presets:
          - id: copy_auto
            group: "copy"
            group_label: "Copy / remux"
            group_label_ru: "Copy / remux"
            tone: "copy"
            label: "Copy"
